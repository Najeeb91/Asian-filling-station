<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PumpOS — Asian Filling Station</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0f766e;--brand2:#115e59;--danger:#b91c1c;--warn:#b45309;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.sub{font-size:11px;color:#cbd5e1}.top button{background:#1e293b;color:#fff;border-radius:10px;padding:9px 11px}
main{max-width:1200px;margin:auto;padding:18px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:12px;color:var(--ink)}.tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px #0f172a0a}.metric{font-size:26px;font-weight:800;margin-top:4px}.label{font-size:12px;color:var(--muted)}.section{margin:18px 0 10px;font-size:16px;font-weight:800}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--brand);color:#fff;padding:10px 14px;border-radius:10px}.secondary{background:#e2e8f0;color:var(--ink);padding:10px 14px;border-radius:10px}.danger{background:#fee2e2;color:var(--danger);padding:10px 14px;border-radius:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#dcfce7;color:var(--ok)}.pill.warn{background:#fef3c7;color:var(--warn)}.pill.danger{background:#fee2e2;color:var(--danger)}.hidden{display:none}.notice{padding:11px 13px;background:#ecfeff;border:1px solid #a5f3fc;border-radius:12px;font-size:12px;color:#155e75;margin-bottom:14px}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#e2e8f0;border-radius:50%;width:34px;height:34px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:center;gap:8px;z-index:19}.footer button{background:#fff;padding:8px 12px;border-radius:10px}.small{font-size:11px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">PumpOS</div><div class="sub">Asian Filling Station • Operations Console</div></div><button onclick="openSettings()">⚙ Settings</button></header>
<main>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<div class="footer"><button onclick="exportData()">Export</button><button onclick="backup()">Backup</button><button onclick="resetDemo()">Reset demo</button></div>
</div>
<div id="modal"></div>
<script>
const KEY="pumpos_v5_final";
const departments=[
 {id:"dashboard",name:"Dashboard",icon:"📊"},
 {id:"sales",name:"Sales",icon:"💳"},
 {id:"fuel",name:"Fuel",icon:"⛽"},
 {id:"customers",name:"Customers",icon:"👥"},
 {id:"expenses",name:"Expenses",icon:"💰"},
 {id:"inventory",name:"Inventory",icon:"📦"},
 {id:"staff",name:"Staff",icon:"🧑‍💼"},
 {id:"reconciliation",name:"Reconciliation",icon:"🧮"},
 {id:"audit",name:"Audit",icon:"🛡️"}
];
const defaultState={
 settings:{
  stationName:"Asian Filling Station",currency:"INR",timezone:"Asia/Kolkata",
  departments:{
   sales:{dailyTarget:150000,receiptPrefix:"SAL",taxRate:0},
   fuel:{petrolPrice:94.72,dieselPrice:87.62,activeNozzles:4,openingStockPetrol:10000,openingStockDiesel:12000},
   customers:{creditLimitDefault:50000,creditDays:30},
   expenses:{approvalLimit:10000},
   inventory:{lowStock:1000},
   staff:{shiftHours:8},
   reconciliation:{tolerance:10}
  }
 },
 sales:[],expenses:[],customers:[],fuelReads:[],inventory:[],staff:[],audit:[]
};
let state=load(), current="dashboard";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function audit(action,detail){state.audit.unshift({id:crypto.randomUUID(),time:new Date().toISOString(),action,detail});save()}
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:state.settings.currency,maximumFractionDigits:2}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function sum(a,f){return a.reduce((x,y)=>x+Number(f(y)||0),0)}
function renderTabs(){tabs.innerHTML=departments.map(d=>`<button class="${current===d.id?"active":""}" onclick="nav('${d.id}')">${d.icon} ${d.name}</button>`).join("")}
function nav(id){current=id;renderTabs();render()}
function render(){renderTabs();const v=document.getElementById("view");({dashboard:dashboard,sales:sales,fuel:fuel,customers:customers,expenses:expenses,inventory:inventory,staff:staff,reconciliation:reconciliation,audit:auditPage}[current]||dashboard)(v)}
function dashboard(v){
 const ds=sum(state.sales,x=>x.total), ex=sum(state.expenses,x=>x.amount), cr=sum(state.customers,x=>x.balance);
 v.innerHTML=`<div class="notice"><b>Final browser test build.</b> Data persists on this device using localStorage. The UI and business workflows are functional; PostgreSQL requires deployment with the server/database layer.</div>
 <div class="grid">${[
 ["Today's Sales",money(sum(state.sales.filter(x=>x.date===today()),x=>x.total))],
 ["Expenses",money(sum(state.expenses.filter(x=>x.date===today()),x=>x.amount))],
 ["Customer Credit",money(cr)],["Audit Events",state.audit.length]
 ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join("")}</div>
 <div class="section">Quick actions</div><div class="grid">
 ${departments.filter(x=>!["dashboard","audit"].includes(x.id)).map(d=>`<div class="card" onclick="nav('${d.id}')"><div style="font-size:25px">${d.icon}</div><b>${d.name}</b><div class="small">Open module →</div></div>`).join("")}</div>
 <div class="section">Recent activity</div><div class="card">${state.audit.slice(0,8).map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(a.action)}</b><div class="small">${esc(a.detail)} • ${new Date(a.time).toLocaleString()}</div></div>`).join("")||"No activity yet."}</div>`;
}
function sales(v){
v.innerHTML=`<div class="section">New Sale</div><div class="card"><div class="formgrid">
<div class="field"><label>Date</label><input id="sdate" type="date" value="${today()}"></div>
<div class="field"><label>Product</label><select id="sprod"><option>Petrol</option><option>Diesel</option><option>Lubricant</option><option>Other</option></select></div>
<div class="field"><label>Quantity / units</label><input id="sqty" type="number" min="0" step=".01"></div>
<div class="field"><label>Rate</label><input id="srate" type="number" min="0" step=".01" value="${state.settings.departments.fuel.petrolPrice}"></div>
<div class="field"><label>Payment</label><select id="spay"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></div>
<div class="field"><label>Reference / customer</label><input id="sref" placeholder="Optional"></div>
</div><div class="actions"><button class="primary" onclick="addSale()">Record sale</button></div></div>
<div class="section">Sales ledger</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th>Payment</th><th></th></tr></thead><tbody>${state.sales.slice(0,100).map(x=>`<tr><td>${x.date}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.total)}</td><td>${esc(x.payment)}</td><td><button class="danger" onclick="del('sales','${x.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="7">No sales recorded.</td></tr>`}</tbody></table></div>`;
}
function addSale(){let q=+sqty.value,r=+srate.value;if(!(q>0&&r>=0))return alert("Enter valid quantity and rate.");let x={id:crypto.randomUUID(),date:sdate.value,product:sprod.value,qty:q,rate:r,total:q*r,payment:spay.value,ref:sref.value,createdAt:new Date().toISOString()};state.sales.unshift(x);audit("Sale recorded",`${x.product} ${q} × ${money(r)} = ${money(x.total)}`);render()}
function fuel(v){
 const f=state.settings.departments.fuel;
 v.innerHTML=`<div class="grid"><div class="card"><div class="label">Petrol price</div><div class="metric">${money(f.petrolPrice)}</div></div><div class="card"><div class="label">Diesel price</div><div class="metric">${money(f.dieselPrice)}</div></div><div class="card"><div class="label">Active nozzles</div><div class="metric">${f.activeNozzles}</div></div><div class="card"><div class="label">Readings</div><div class="metric">${state.fuelReads.length}</div></div></div>
 <div class="section">Daily meter / tank reading</div><div class="card"><div class="formgrid"><div class="field"><label>Date</label><input id="fdate" type="date" value="${today()}"></div><div class="field"><label>Fuel</label><select id="ffuel"><option>Petrol</option><option>Diesel</option></select></div><div class="field"><label>Opening meter</label><input id="fopen" type="number" min="0"></div><div class="field"><label>Closing meter</label><input id="fclose" type="number" min="0"></div><div class="field"><label>Dip / stock reading</label><input id="fdip" type="number" min="0"></div></div><div class="actions"><button class="primary" onclick="addFuel()">Save reading</button></div></div>
 <div class="section">Readings</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Dispensed</th><th>Dip</th></tr></thead><tbody>${state.fuelReads.map(x=>`<tr><td>${x.date}</td><td>${x.fuel}</td><td>${x.open}</td><td>${x.close}</td><td>${(x.close-x.open).toFixed(2)}</td><td>${x.dip}</td></tr>`).join("")||`<tr><td colspan="6">No readings.</td></tr>`}</tbody></table></div>`;
}
function addFuel(){let o=+fopen.value,c=+fclose.value,d=+fdip.value;if(!(o>=0&&c>=o&&d>=0))return alert("Check meter and dip values.");let x={id:crypto.randomUUID(),date:fdate.value,fuel:ffuel.value,open:o,close:c,dip:d};state.fuelReads.unshift(x);audit("Fuel reading saved",`${x.fuel}: ${o} → ${c}`);render()}
function customers(v){
v.innerHTML=`<div class="section">Customer master</div><div class="card"><div class="formgrid"><div class="field"><label>Name</label><input id="cname"></div><div class="field"><label>Phone / code</label><input id="cphone"></div><div class="field"><label>Credit limit</label><input id="climit" type="number" value="${state.settings.departments.customers.creditLimitDefault}"></div><div class="field"><label>Opening balance</label><input id="cbal" type="number" value="0"></div></div><div class="actions"><button class="primary" onclick="addCustomer()">Add customer</button></div></div>
<div class="section">Customers</div><div class="card tablewrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Limit</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>${state.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${money(x.limit)}</td><td>${money(x.balance)}</td><td><span class="pill ${x.balance>x.limit?"danger":""}">${x.balance>x.limit?"OVER LIMIT":"OK"}</span></td><td><button class="danger" onclick="del('customers','${x.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="6">No customers.</td></tr>`}</tbody></table></div>`
}
function addCustomer(){if(!cname.value.trim())return alert("Enter customer name.");let x={id:crypto.randomUUID(),name:cname.value.trim(),phone:cphone.value.trim(),limit:+climit.value||0,balance:+cbal.value||0};state.customers.push(x);audit("Customer added",x.name);render()}
function expenses(v){
v.innerHTML=`<div class="section">Record expense</div><div class="card"><div class="formgrid"><div class="field"><label>Date</label><input id="edate" type="date" value="${today()}"></div><div class="field"><label>Category</label><input id="ecat" placeholder="Electricity, repair..."></div><div class="field"><label>Amount</label><input id="eamt" type="number" min="0"></div><div class="field"><label>Payment/reference</label><input id="eref"></div></div><div class="actions"><button class="primary" onclick="addExpense()">Record expense</button></div></div>
<div class="section">Expense ledger</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Ref</th><th></th></tr></thead><tbody>${state.expenses.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.ref)}</td><td><button class="danger" onclick="del('expenses','${x.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="5">No expenses.</td></tr>`}</tbody></table></div>`
}
function addExpense(){let a=+eamt.value;if(!(a>0))return alert("Enter amount.");let x={id:crypto.randomUUID(),date:edate.value,category:ecat.value||"Other",amount:a,ref:eref.value};state.expenses.unshift(x);audit("Expense recorded",`${x.category}: ${money(a)}`);render()}
function inventory(v){
v.innerHTML=`<div class="section">Inventory</div><div class="card"><div class="formgrid"><div class="field"><label>Item</label><input id="iname"></div><div class="field"><label>Unit</label><input id="iunit" value="unit"></div><div class="field"><label>Current quantity</label><input id="iqty" type="number" min="0"></div><div class="field"><label>Reorder level</label><input id="ireorder" type="number" min="0" value="${state.settings.departments.inventory.lowStock}"></div></div><div class="actions"><button class="primary" onclick="addInventory()">Save item</button></div></div>
<div class="section">Stock list</div><div class="card tablewrap"><table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Reorder</th><th>Status</th><th></th></tr></thead><tbody>${state.inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${x.reorder}</td><td><span class="pill ${x.qty<=x.reorder?"warn":""}">${x.qty<=x.reorder?"LOW":"OK"}</span></td><td><button class="danger" onclick="del('inventory','${x.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="5">No stock items.</td></tr>`}</tbody></table></div>`
}
function addInventory(){if(!iname.value.trim())return alert("Enter item.");let x={id:crypto.randomUUID(),name:iname.value.trim(),unit:iunit.value||"unit",qty:+iqty.value||0,reorder:+ireorder.value||0};state.inventory.push(x);audit("Inventory item saved",x.name);render()}
function staff(v){
v.innerHTML=`<div class="section">Staff register</div><div class="card"><div class="formgrid"><div class="field"><label>Name</label><input id="stname"></div><div class="field"><label>Role</label><input id="strole"></div><div class="field"><label>Shift</label><select id="stshift"><option>Morning</option><option>Evening</option><option>Night</option></select></div></div><div class="actions"><button class="primary" onclick="addStaff()">Add staff</button></div></div>
<div class="section">Staff</div><div class="card tablewrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Shift</th><th></th></tr></thead><tbody>${state.staff.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(x.shift)}</td><td><button class="danger" onclick="del('staff','${x.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="4">No staff.</td></tr>`}</tbody></table></div>`
}
function addStaff(){if(!stname.value.trim())return alert("Enter staff name.");let x={id:crypto.randomUUID(),name:stname.value.trim(),role:strole.value||"Staff",shift:stshift.value};state.staff.push(x);audit("Staff added",x.name);render()}
function reconciliation(v){
 const s=sum(state.sales.filter(x=>x.date===today()),x=>x.total), tol=state.settings.departments.reconciliation.tolerance;
 v.innerHTML=`<div class="notice">Reconciliation compares today's recorded sales with the cash/UPI/card totals you enter. Difference within tolerance is marked OK.</div>
 <div class="card"><div class="formgrid"><div class="field"><label>Recorded sales</label><input value="${s.toFixed(2)}" disabled></div><div class="field"><label>Cash counted</label><input id="rcash" type="number" min="0" value="0"></div><div class="field"><label>UPI/card confirmed</label><input id="rdigital" type="number" min="0" value="0"></div><div class="field"><label>Credit sales</label><input id="rcredit" type="number" min="0" value="0"></div></div><div class="actions"><button class="primary" onclick="reconcile()">Run reconciliation</button></div><div id="rresult" class="section"></div></div>`
}
function reconcile(){let expected=sum(state.sales.filter(x=>x.date===today()),x=>x.total),actual=(+rcash.value||0)+(+rdigital.value||0)+(+rcredit.value||0),diff=actual-expected,tol=state.settings.departments.reconciliation.tolerance;rresult.innerHTML=`Result: <span class="pill ${Math.abs(diff)<=tol?"":"danger"}">${Math.abs(diff)<=tol?"BALANCED":"MISMATCH"}</span> <b>${money(diff)}</b> difference`;audit("Reconciliation run",`Expected ${money(expected)}, actual ${money(actual)}, difference ${money(diff)}`)}
function auditPage(v){v.innerHTML=`<div class="section">Audit log</div><div class="card tablewrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Detail</th></tr></thead><tbody>${state.audit.map(x=>`<tr><td>${new Date(x.time).toLocaleString()}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join("")||`<tr><td colspan="3">No audit events.</td></tr>`}</tbody></table></div>`}
function del(key,id){if(!confirm("Delete this record?"))return;state[key]=state[key].filter(x=>x.id!==id);audit("Record deleted",`${key}: ${id}`);render()}
function openSettings(){
const d=state.settings.departments;
modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>Master Settings</h2><button class="close" onclick="closeModal()">×</button></div>
<p class="small">Each department has its own settings. Edit and save; reset only resets the selected department.</p>
<div class="formgrid">
<div class="field"><label>Station name</label><input id="setStation" value="${esc(state.settings.stationName)}"></div><div class="field"><label>Currency</label><input id="setCurrency" value="${esc(state.settings.currency)}"></div>
<div class="field"><label>Sales daily target</label><input id="setTarget" type="number" value="${d.sales.dailyTarget}"></div><div class="field"><label>Receipt prefix</label><input id="setPrefix" value="${esc(d.sales.receiptPrefix)}"></div>
<div class="field"><label>Petrol price</label><input id="setPetrol" type="number" step=".01" value="${d.fuel.petrolPrice}"></div><div class="field"><label>Diesel price</label><input id="setDiesel" type="number" step=".01" value="${d.fuel.dieselPrice}"></div>
<div class="field"><label>Active nozzles</label><input id="setNozzles" type="number" value="${d.fuel.activeNozzles}"></div><div class="field"><label>Customer credit limit</label><input id="setCredit" type="number" value="${d.customers.creditLimitDefault}"></div>
<div class="field"><label>Customer credit days</label><input id="setDays" type="number" value="${d.customers.creditDays}"></div><div class="field"><label>Expense approval limit</label><input id="setApproval" type="number" value="${d.expenses.approvalLimit}"></div>
<div class="field"><label>Inventory low-stock level</label><input id="setLow" type="number" value="${d.inventory.lowStock}"></div><div class="field"><label>Reconciliation tolerance</label><input id="setTol" type="number" value="${d.reconciliation.tolerance}"></div>
</div><div class="actions"><button class="primary" onclick="saveSettings()">Save all settings</button><button class="secondary" onclick="resetDepartmentSettings()">Reset department defaults</button></div></div></div>`;
}
function closeModal(){modal.innerHTML=""}
function saveSettings(){let d=state.settings.departments;state.settings.stationName=setStation.value;state.settings.currency=setCurrency.value||"INR";d.sales.dailyTarget=+setTarget.value||0;d.sales.receiptPrefix=setPrefix.value||"SAL";d.fuel.petrolPrice=+setPetrol.value||0;d.fuel.dieselPrice=+setDiesel.value||0;d.fuel.activeNozzles=+setNozzles.value||0;d.customers.creditLimitDefault=+setCredit.value||0;d.customers.creditDays=+setDays.value||0;d.expenses.approvalLimit=+setApproval.value||0;d.inventory.lowStock=+setLow.value||0;d.reconciliation.tolerance=+setTol.value||0;audit("Settings updated","Master settings and department values saved");closeModal();render()}
function resetDepartmentSettings(){if(!confirm("Reset department settings to defaults?"))return;state.settings.departments=structuredClone(defaultState.settings.departments);audit("Settings reset","Department settings restored to defaults");closeModal();render()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`pumpos-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function backup(){exportData();alert("Backup JSON generated. Keep it safely; it can be used to restore data in a future server migration.")}
function resetDemo(){if(!confirm("Delete all local data and restore demo defaults?"))return;state=structuredClone(defaultState);save();audit("System reset","Demo state restored");render()}
save();render();
</script>
</body>
</html>
