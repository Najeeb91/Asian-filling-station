<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a52">
<title>PumpOS Staff Prototype — Machine Handover v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#10213b;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:900;color:#0b2a52}.brand i{color:#f59e0b;font-style:normal}
button,input,select{font:inherit}button{cursor:pointer}.icon{border:0;background:#f1f3f6;border-radius:13px;width:42px;height:42px}
.card,.item,.stat,.action{background:#fff;border:1px solid #e5e7eb;border-radius:17px}.card{padding:15px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#0b2a52,#19579a);color:#fff;border:0}.hero .muted{color:#dbeafe}.muted{color:#6b7280}
.small{font-size:12px}.bold{font-weight:800}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{padding:12px}.stat .v{font-size:19px;font-weight:900;margin-top:7px}.stat .s{font-size:11px;color:#6b7280;margin-top:3px}
.section{font-weight:900;margin:8px 2px 9px}.action{padding:13px 8px;text-align:center;min-height:96px}.action .ico{font-size:25px}.action b{display:block;font-size:12px;margin-top:6px}.action small{color:#6b7280;font-size:10px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:#0b2a52;color:white}.ghost{background:#f1f3f6;color:#10213b}.full{width:100%}
.ok,.bad,.warn{padding:10px 12px;border-radius:13px;font-size:13px}.ok{background:#ecfdf3;color:#087a31}.bad{background:#fef2f2;color:#a91b1b}.warn{background:#fff7ed;color:#9a5700}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 7px env(safe-area-inset-bottom);z-index:20}
.nav{border:0;background:transparent;color:#667085;border-radius:12px;padding:6px;font-size:11px}.nav div{font-size:21px}.nav.active{background:#eef4ff;color:#2563eb;font-weight:800}
.sheetbg{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end}.sheet{background:white;width:100%;max-width:520px;max-height:92vh;overflow:auto;margin:auto 0 0;border-radius:24px 24px 0 0;padding:17px}
.close{float:right;border:0;background:#f1f3f6;border-radius:50%;width:40px;height:40px;font-size:24px;line-height:40px}
.input,.select{width:100%;padding:11px;border:1px solid #d8dde6;border-radius:11px;background:white}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}
.machinegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.machine{border:2px solid #e5e7eb;border-radius:15px;background:#fff;padding:12px;text-align:left}.machine.sel{border-color:#2563eb;background:#eff6ff}
.noz{display:inline-block;background:#f1f3f6;border-radius:7px;padding:4px 5px;font-size:9px;margin:3px 2px 0 0}
.list{display:grid;gap:8px}.item{padding:12px;text-align:left}.meta{font-size:11px;color:#6b7280;margin-top:4px}
.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tab{border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:7px 11px;white-space:nowrap;font-size:11px}.tab.active{background:#0b2a52;color:#fff}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:11px;z-index:100;font-size:12px;max-width:90%;text-align:center}
.reading{font-size:20px;font-weight:900}.locked{background:#f8fafc;border:1px dashed #cbd5e1;padding:10px;border-radius:12px}

.fuelbtn{border:2px solid #e5e7eb;background:#fff;border-radius:15px;padding:14px;font-weight:900;text-align:center}
.fuelbtn.petrol.sel{border-color:#15803d;background:#ecfdf3;color:#166534}
.fuelbtn.diesel.sel{border-color:#1d4ed8;background:#eff6ff;color:#1e40af}
.nozzlecard{background:#fff;border:1px solid #dfe5ec;border-radius:16px;padding:12px;margin-top:9px}
.nozzlehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.readrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.readbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:9px}
.readbox .cap{font-size:10px;color:#64748b;font-weight:800}
.readbox .num{font-size:18px;font-weight:900;margin-top:3px}
.testrow{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px;margin-top:7px}
.fuelsummary{border-radius:15px;padding:12px;margin-top:11px;border:1px solid #dbe5ee}
.fuelsummary.petrol{background:#f0fdf4;border-color:#bbf7d0}
.fuelsummary.diesel{background:#eff6ff;border-color:#bfdbfe}
.finalfuel{border:1px solid #dbe5ee;border-radius:16px;padding:16px;text-align:center}
.finalfuel.petrol{background:#f0fdf4}
.finalfuel.diesel{background:#eff6ff}
.finalnum{font-size:30px;font-weight:950;margin-top:5px}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="icon" onclick="go('more')" aria-label="Menu">☰</button>
  <div class="brand">Pump<i>OS</i></div>
  <button class="icon" onclick="notify()" aria-label="Notifications">🔔</button>
</header>
<main id="screen"></main>
<nav class="bottom">
  <button class="nav active" id="n-home" onclick="go('home')"><div>⌂</div>Home</button>
  <button class="nav" id="n-tx" onclick="go('tx')"><div>▤</div>Transactions</button>
  <button class="nav" id="n-more" onclick="go('more')"><div>⋮</div>More</button>
  <button class="nav" id="n-profile" onclick="go('profile')"><div>♙</div>Profile</button>
</nav>
</div>
<div id="modal"></div>

<script>
const KEY='pumpos_staff_reset_v1';
const PRICE={Petrol:100,Diesel:95};
const NOZZLES=['P1 Petrol','P2 Petrol','P3 Petrol','D1 Diesel','D2 Diesel','D3 Diesel'];
const MACHINES=Array.from({length:6},(_,i)=>'M-0'+(i+1));

function blankMeters(){return Object.fromEntries(NOZZLES.map(n=>[n,0]));}
function fresh(){
  const openings={}; MACHINES.forEach(m=>openings[m]=blankMeters());
  return {
    version:1,
    staff:{name:'Demo Staff',id:'ST-001',role:'Staff'},
    machine:'',
    shift:{type:'8 Hours',start:'06:00',end:'14:00'},
    openings,
    handovers:[],
    collections:[],
    credits:[],
    expenses:[],
    tests:[],
    closing:null
  };
}
let S=JSON.parse(localStorage.getItem(KEY)||'null');
if(!S || S.version!==1) S=fresh();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function money(x){return '₹'+Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function now(){return new Date().toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}
function toast(x){const t=document.createElement('div');t.className='toast';t.textContent=x;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function currentOpening(){return S.machine ? (S.openings[S.machine]||blankMeters()) : blankMeters()}
function fuelOf(noz){return noz.startsWith('P')?'Petrol':'Diesel'}
function meterTotals(readings, opening){
  let pL=0,dL=0;
  NOZZLES.forEach(n=>{const diff=Math.max(0,(+readings[n]||0)-(+opening[n]||0)); if(fuelOf(n)==='Petrol')pL+=diff;else dL+=diff});
  return {pL,dL,pA:pL*PRICE.Petrol,dA:dL*PRICE.Diesel,total:pL*PRICE.Petrol+dL*PRICE.Diesel};
}
function latestHandover(){
  return S.handovers.length ? S.handovers[S.handovers.length-1] : null;
}
function todayTestsValue(){
  return S.tests.reduce((a,x)=>a+(+x.qty||0)*PRICE[fuelOf(x.nozzle)],0);
}
function saleSummary(){
  if(!S.machine) return {pL:0,dL:0,pA:0,dA:0,total:0,meterP:0,meterD:0,testP:0,testD:0};
  const op=currentOpening();
  const h=S.handovers.filter(x=>x.machine===S.machine).slice(-1)[0];
  if(!h) return {pL:0,dL:0,pA:0,dA:0,total:0,meterP:0,meterD:0,testP:0,testD:0};

  // IMPORTANT: The handover's own opening is authoritative.
  // Do not compare it with currentOpening(), because currentOpening() becomes
  // the next shift's opening after a handover.
  const meter=meterTotals(h.readings,h.opening);
  let testP=0,testD=0;
  S.tests.filter(x=>x.machine===S.machine && x.time>=h.time).forEach(x=>{
    if(fuelOf(x.nozzle)==='Petrol') testP += +x.qty||0;
    else testD += +x.qty||0;
  });

  // Testing is never subtracted from the physical meter.
  // It is deducted only from accounting/sale quantity.
  const pL=Math.max(0,meter.pL-testP);
  const dL=Math.max(0,meter.dL-testD);
  return {
    pL,dL,
    pA:pL*PRICE.Petrol,
    dA:dL*PRICE.Diesel,
    total:pL*PRICE.Petrol+dL*PRICE.Diesel,
    meterP:meter.pL,meterD:meter.dL,testP,testD
  };
}
function collectionTotals(){
  const c={Cash:0,UPI:0,Card:0,'Bank Transfer':0,Credit:0};
  S.collections.forEach(x=>c[x.mode]=(c[x.mode]||0)+(+x.amount||0));
  S.credits.forEach(x=>c.Credit+=+x.amount||0);
  return c;
}
function go(p){
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  const id=p==='tx'?'n-tx':p==='more'?'n-more':p==='profile'?'n-profile':'n-home';
  document.getElementById(id).classList.add('active');
  if(p==='home')home(); else if(p==='tx')tx(); else if(p==='more')more(); else profile();
}
function home(){
  const s=saleSummary(), c=collectionTotals(), totalCollected=Object.values(c).reduce((a,b)=>a+b,0);
  const variance=totalCollected-s.total;
  const op=S.machine?currentOpening():blankMeters();
  const h=latestHandover();
  document.getElementById('screen').innerHTML=`
    <div class="card hero">
      <div class="row between"><div><div class="muted small">Good day</div><h2>${S.staff.name} 👋</h2></div><b>${S.machine?'ACTIVE':'READY'}</b></div>
      <div class="row between" style="margin-top:12px">
        <div><div class="muted small">My Machine</div><b style="font-size:24px">${S.machine||'Not selected'}</b></div>
        <div style="text-align:right"><div class="muted small">Shift</div><b>${S.shift.type}</b></div>
      </div>
      <button class="btn ${S.machine?'ghost':'primary'} full" style="margin-top:12px" onclick="machines()">${S.machine?'Change Machine':'Choose Machine'}</button>
    </div>

    <div class="section">TODAY'S SALES</div>
    <div class="grid3">
      <div class="stat"><div class="small">⛽ PETROL SOLD</div><div class="v">${s.pL.toFixed(2)} L</div><div class="s">${money(s.pA)}</div></div>
      <div class="stat"><div class="small">🛢️ DIESEL SOLD</div><div class="v">${s.dL.toFixed(2)} L</div><div class="s">${money(s.dA)}</div></div>
      <div class="stat"><div class="small">₹ TOTAL SALE</div><div class="v" style="font-size:16px">${money(s.total)}</div><div class="s">After testing adjustment</div></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="row between"><div class="section" style="margin:0">COLLECTION SUMMARY</div><button class="btn ghost" onclick="go('tx')">Details</button></div>
      <div class="list" style="margin-top:10px">
        ${[['Cash','💵'],['UPI','📱'],['Card','💳'],['Bank Transfer','🏦'],['Credit','👤']].map(x=>`<div class="row between"><span>${x[1]} ${x[0]}</span><b>${money(c[x[0]])}</b></div>`).join('')}
      </div>
      <hr style="border:0;border-top:1px solid #e5e7eb">
      <div class="row between"><b>Total Collected</b><b>${money(totalCollected)}</b></div>
      <div style="margin-top:9px" class="${variance===0?'ok':variance<0?'bad':'ok'}">
        ${variance===0?'✅ MATCHED':variance<0?'🔴 SHORTAGE':'🟢 EXCESS'}
        <b style="float:right">${money(Math.abs(variance))}</b>
      </div>
    </div>

    <div class="section">QUICK ACTIONS</div>
    <div class="grid2">
      <button class="action" onclick="startHandover()"><div class="ico">🔄</div><b>Machine Handover</b><small>Closing + optional testing</small></button>
      <button class="action" onclick="collection('Cash')"><div class="ico">💵</div><b>Cash Entry</b><small>Amount only</small></button>
      <button class="action" onclick="collection('UPI')"><div class="ico">📱</div><b>UPI / Digital</b><small>Amount + reference</small></button>
      <button class="action" onclick="credit()"><div class="ico">👤</div><b>Credit Entry</b><small>Customer + fuel detail</small></button>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="section">CURRENT METER STATE</div>
      ${S.machine?`<div class="row between"><span>Opening</span><b>000000 (initial reset)</b></div>
      <div class="row between" style="margin-top:8px"><span>Latest Handover</span><b>${h&&h.machine===S.machine?'Saved & Locked':'Not entered'}</b></div>
      <div class="meta" style="margin-top:8px">Rates: Petrol ${money(PRICE.Petrol)}/L • Diesel ${money(PRICE.Diesel)}/L</div>
      <div class="meta" style="margin-top:7px">Testing is deducted from sale/accounting, never from the meter reading.</div>`
      :`<div class="muted">Choose a machine to begin.</div>`}
    </div>`;
}

function open(title,body){
  const modal=document.getElementById('modal');
  modal.innerHTML=`<div class="sheetbg" onclick="if(event.target===this)closeModal()">
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" onclick="closeModal()" aria-label="Close">×</button>
      <h2>${title}</h2>${body}
    </div></div>`;
}
function closeModal(){document.getElementById('modal').innerHTML='';}
function machines(){
  open('Choose Machine',`
    <div class="warn">Prototype reset: all 6 machines are selectable. Manager assignment/locking will be connected later.</div>
    <div class="machinegrid" style="margin-top:10px">
      ${MACHINES.map(m=>`<button class="machine ${S.machine===m?'sel':''}" onclick="pickMachine('${m}')">
        <b>${m}</b><div class="meta">6 nozzles • Opening 000000</div>
        <div>${['P1','P2','P3'].map(n=>`<span class="noz">${n} Petrol</span>`).join('')}
        ${['D1','D2','D3'].map(n=>`<span class="noz">${n} Diesel</span>`).join('')}</div>
      </button>`).join('')}
    </div>
    <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Back</button>`);
}
function pickMachine(m){S.machine=m;save();closeModal();toast(m+' selected');home()}

function collection(mode){
  if(!S.machine)return toast('Choose a machine first');
  open(mode==='Bank Transfer'?'Bank Transfer Entry':mode+' Collection',`
    <div class="ok">Meter decides the total fuel sale. This screen records only the actual amount collected by ${mode}.</div>
    <label>Amount (₹)</label><input id="amt" class="input" type="number" min="0" step="0.01">
    ${mode!=='Cash'?'<label>Reference / UTR (optional)</label><input id="ref" class="input">':''}
    <label>Note (optional)</label><input id="note" class="input">
    <button class="btn primary full" style="margin-top:15px" onclick="saveCollection('${mode}')">Save ${mode}</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Back</button>`);
}
function saveCollection(mode){
  const a=+document.getElementById('amt').value;
  if(a<0 || !Number.isFinite(a))return toast('Enter a valid amount');
  S.collections.push({id:Date.now(),time:now(),machine:S.machine,mode,amount:a,ref:document.getElementById('ref')?.value||'',note:document.getElementById('note').value});
  save();closeModal();toast(mode+' collection saved');home();
}

function credit(){
  if(!S.machine)return toast('Choose a machine first');
  open('Credit Entry',`
    <div class="ok">👤 Only Manager-approved customers are available. Credit remains customer-wise and fuel-wise.</div>
    <label>Customer</label><select id="cust" class="select">
      <option>ABC Transport — Available ₹32,000</option>
      <option>XYZ Contractors — Available ₹18,500</option>
      <option>Local Fleet — Available ₹12,000</option>
    </select>
    <label>Fuel Type</label><select id="cfuel" class="select"><option>Diesel</option><option>Petrol</option></select>
    <label>Quantity (L)</label><input id="cqty" class="input" type="number" min="0" step="0.01">
    <label>Rate (auto)</label><input id="crate" class="input" value="${PRICE.Diesel}" readonly>
    <div class="card" style="margin-top:10px"><div class="row between"><span>Credit Sale</span><b id="creditTotal">₹0.00</b></div></div>
    <button class="btn primary full" style="margin-top:8px" onclick="saveCredit()">Save Credit Sale</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Back</button>`);
  document.getElementById('cfuel').onchange=()=>{document.getElementById('crate').value=PRICE[document.getElementById('cfuel').value]; updateCreditTotal()};
  document.getElementById('cqty').oninput=updateCreditTotal;
}
function updateCreditTotal(){
  const fuel=document.getElementById('cfuel').value,q=+document.getElementById('cqty').value||0;
  document.getElementById('creditTotal').textContent=money(q*PRICE[fuel]);
}
function saveCredit(){
  const fuel=document.getElementById('cfuel').value,q=+document.getElementById('cqty').value||0;
  if(q<=0)return toast('Enter a valid quantity');
  const amount=q*PRICE[fuel];
  S.credits.push({id:Date.now(),time:now(),machine:S.machine,customer:document.getElementById('cust').value,fuel,qty:q,rate:PRICE[fuel],amount});
  save();closeModal();toast('Credit sale saved');home();
}


let handoverDraft = null;

function startHandover(){
  if(!S.machine){
    handoverDraft=null;
    return open('Machine Handover',`
      <div class="warn">First select the machine that is being handed over.</div>
      <button class="btn primary full" style="margin-top:12px" onclick="machinesForHandover()">Select Machine</button>
      <button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Back</button>`);
  }
  handoverDraft={
    machine:S.machine,
    fuel:null,
    readings:{...currentOpening()},
    closing:{},
    tests:{},
  };
  NOZZLES.forEach(n=>handoverDraft.tests[n]=[]);
  handoverFuelSelect();
}

function machinesForHandover(){
  open('Select Machine',`
    <div class="ok">Choose the machine being handed over. All 6 machines are available in this standalone prototype.</div>
    <div class="machinegrid" style="margin-top:10px">
      ${MACHINES.map(m=>`<button class="machine" onclick="selectHandoverMachine('${m}')">
        <b>${m}</b><div class="meta">6 nozzles</div>
        <div>${['P1','P2','P3'].map(n=>`<span class="noz">${n} Petrol</span>`).join('')}
        ${['D1','D2','D3'].map(n=>`<span class="noz">${n} Diesel</span>`).join('')}</div>
      </button>`).join('')}
    </div>
    <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Back</button>`);
}

function selectHandoverMachine(m){
  S.machine=m; save();
  handoverDraft={
    machine:m,
    fuel:null,
    readings:{...(S.openings[m]||blankMeters())},
    closing:{},
    tests:{},
  };
  NOZZLES.forEach(n=>handoverDraft.tests[n]=[]);
  handoverFuelSelect();
}

function handoverFuelSelect(){
  const d=handoverDraft;
  open('Machine Handover — '+d.machine,`
    <div class="ok"><b>Opening readings are automatic.</b> They come from the last locked handover. First-time opening is 000000.00.</div>
    <div class="section" style="margin-top:15px">SELECT FUEL TYPE</div>
    <div class="grid2">
      <button class="fuelbtn petrol" onclick="selectHandoverFuel('Petrol')">⛽<br>PETROL</button>
      <button class="fuelbtn diesel" onclick="selectHandoverFuel('Diesel')">🛢️<br>DIESEL</button>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="row between"><span>Machine</span><b>${d.machine}</b></div>
      <div class="row between" style="margin-top:7px"><span>Petrol nozzles</span><b>P1 • P2 • P3</b></div>
      <div class="row between" style="margin-top:7px"><span>Diesel nozzles</span><b>D1 • D2 • D3</b></div>
    </div>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Back</button>`);
}

function selectHandoverFuel(fuel){
  handoverDraft.fuel=fuel;
  renderHandoverFuel();
}

function handoverNozzles(fuel){
  return fuel==='Petrol'?['P1 Petrol','P2 Petrol','P3 Petrol']:['D1 Diesel','D2 Diesel','D3 Diesel'];
}

function handoverFuelTotals(fuel){
  const ns=handoverNozzles(fuel);
  let meter=0,test=0,net=0;
  ns.forEach(n=>{
    const o=+handoverDraft.readings[n]||0;
    const c=handoverDraft.closing[n];
    const m=Number.isFinite(c)?Math.max(0,c-o):0;
    const t=handoverDraft.tests[n].reduce((a,x)=>a+(+x.qty||0),0);
    meter+=m; test+=t; net+=Math.max(0,m-t);
  });
  return {meter,test,net};
}

function renderHandoverFuel(){
  const d=handoverDraft, fuel=d.fuel, ns=handoverNozzles(fuel);
  const color=fuel==='Petrol'?'petrol':'diesel';
  const total=handoverFuelTotals(fuel);
  open(`M${d.machine.replace('M-0','')} — ${fuel.toUpperCase()}`,`
    <div class="row between">
      <div><b>Machine ${d.machine}</b><div class="meta">${fuel} • ${ns.map(n=>n.split(' ')[0]).join(' • ')}</div></div>
      <button class="btn ghost" onclick="handoverFuelSelect()">Change Fuel</button>
    </div>
    <div class="ok" style="margin-top:10px">Opening is system-filled. Enter only the <b>Closing Reading</b>. Testing is added inside the same nozzle card and never changes the meter reading.</div>

    ${ns.map((n,i)=>{
      const o=+d.readings[n]||0;
      const c=d.closing[n];
      const meter=Number.isFinite(c)?Math.max(0,c-o):null;
      const tests=d.tests[n]||[];
      const t=tests.reduce((a,x)=>a+(+x.qty||0),0);
      const net=meter===null?null:Math.max(0,meter-t);
      return `<div class="nozzlecard">
        <div class="nozzlehead">
          <b>${n.split(' ')[0]} — ${fuel}</b>
          ${net!==null?`<b>${net.toFixed(2)} L net</b>`:''}
        </div>
        <div class="readrow">
          <div class="readbox"><div class="cap">OPENING (AUTO)</div><div class="num">${o.toFixed(2)}</div></div>
          <div>
            <div class="cap" style="font-size:10px;color:#64748b;font-weight:800;margin-bottom:4px">CLOSING READING</div>
            <input id="hc_${i}" class="input" type="number" min="${o}" step="0.01" value="${Number.isFinite(c)?c:''}" placeholder="Enter closing">
          </div>
        </div>
        <button class="btn ${tests.length?'ghost':'primary'} full" style="margin-top:9px" onclick="saveHandoverClosing('${n}',${i},'${fuel}')">Save Closing</button>
        <button class="btn ghost full" style="margin-top:7px" onclick="addHandoverTesting('${n}','${fuel}')">＋ Add Testing</button>
        ${tests.length?tests.map((x,j)=>`<div class="testrow"><div class="row between"><b>Testing ${j+1}</b><b>${(+x.qty||0).toFixed(2)} L</b></div><div class="meta">${x.note||'No note'} <button class="btn ghost" style="float:right;padding:3px 7px" onclick="removeHandoverTesting('${n}',${j})">Delete</button></div></div>`).join(''):''}
        ${meter!==null?`<div class="card" style="margin:9px 0 0;padding:9px;background:#f8fafc">
          <div class="row between"><span>Meter Sale</span><b>${meter.toFixed(2)} L</b></div>
          <div class="row between" style="margin-top:4px"><span>Testing</span><b>− ${t.toFixed(2)} L</b></div>
          <div class="row between" style="margin-top:4px"><span><b>Net ${fuel} Sold</b></span><b>${net.toFixed(2)} L</b></div>
        </div>`:''}
      </div>`;
    }).join('')}

    <div class="fuelsummary ${color}">
      <div class="row between"><b>${fuel.toUpperCase()} SUMMARY</b><b>${total.net.toFixed(2)} L NET SOLD</b></div>
      <div class="row between" style="margin-top:7px"><span>Meter Sale</span><b>${total.meter.toFixed(2)} L</b></div>
      <div class="row between" style="margin-top:4px"><span>Testing</span><b>${total.test.toFixed(2)} L</b></div>
      <div class="row between" style="margin-top:4px"><span>Net ${fuel} Sold</span><b>${total.net.toFixed(2)} L</b></div>
    </div>

    <button class="btn primary full" style="margin-top:12px" onclick="handoverSummary()">View Final Summary</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="handoverFuelSelect()">Back to Fuel Selection</button>`);
}

function saveHandoverClosing(noz,index,fuel){
  const input=document.getElementById('hc_'+index);
  const v=+input.value;
  const o=+handoverDraft.readings[noz]||0;
  if(!Number.isFinite(v)||v<o)return toast('Closing must be entered and cannot be below opening');
  handoverDraft.closing[noz]=v;
  toast(noz+' closing saved');
  renderHandoverFuel();
}

function addHandoverTesting(noz,fuel){
  open(`Add Testing — ${noz.split(' ')[0]} ${fuel}`,`
    <div class="ok"><b>${noz.split(' ')[0]}</b> is selected automatically. Testing is linked to this exact machine + nozzle.</div>
    <label>Testing Quantity (L)</label>
    <input id="htq" class="input" type="number" min="0.01" step="0.01" placeholder="Enter quantity">
    <label>Note (optional)</label>
    <input id="htn" class="input">
    <button class="btn primary full" style="margin-top:14px" onclick="saveHandoverTesting('${noz}','${fuel}')">Add Testing</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="renderHandoverFuel()">Back</button>`);
}

function saveHandoverTesting(noz,fuel){
  const q=+document.getElementById('htq').value;
  if(!Number.isFinite(q)||q<=0)return toast('Enter a valid testing quantity');
  handoverDraft.tests[noz].push({qty:q,note:document.getElementById('htn').value||''});
  toast('Testing added to '+noz.split(' ')[0]);
  renderHandoverFuel();
}

function removeHandoverTesting(noz,index){
  handoverDraft.tests[noz].splice(index,1);
  renderHandoverFuel();
}

function handoverSummary(){
  const d=handoverDraft;
  const p=handoverFuelTotals('Petrol'), de=handoverFuelTotals('Diesel');
  const missing=NOZZLES.filter(n=>!Number.isFinite(d.closing[n]));
  if(missing.length)return toast('Enter closing for: '+missing.map(n=>n.split(' ')[0]).join(', '));

  open('MACHINE HANDOVER — FINAL SUMMARY',`
    <div class="ok"><b>Final accounting quantity only.</b> Testing has already been deducted separately inside Petrol and Diesel. No ₹ value is shown here.</div>

    <div class="finalfuel petrol" style="margin-top:12px">
      <div class="small">⛽ PETROL SOLD</div>
      <div class="finalnum">${p.net.toFixed(2)} L</div>
    </div>

    <div class="finalfuel diesel" style="margin-top:10px">
      <div class="small">🛢️ DIESEL SOLD</div>
      <div class="finalnum">${de.net.toFixed(2)} L</div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="section" style="margin:0 0 8px">Fuel-wise review</div>
      <div class="row between"><span>Petrol meter sale</span><b>${p.meter.toFixed(2)} L</b></div>
      <div class="row between" style="margin-top:5px"><span>Petrol testing deducted</span><b>− ${p.test.toFixed(2)} L</b></div>
      <div class="row between" style="margin-top:5px"><span><b>Petrol sold</b></span><b>${p.net.toFixed(2)} L</b></div>
      <hr style="border:0;border-top:1px solid #e5e7eb;margin:10px 0">
      <div class="row between"><span>Diesel meter sale</span><b>${de.meter.toFixed(2)} L</b></div>
      <div class="row between" style="margin-top:5px"><span>Diesel testing deducted</span><b>− ${de.test.toFixed(2)} L</b></div>
      <div class="row between" style="margin-top:5px"><span><b>Diesel sold</b></span><b>${de.net.toFixed(2)} L</b></div>
    </div>

    <div class="warn">After locking, every closing reading becomes the next opening automatically. The meter itself is never reduced by testing.</div>

    <button class="btn primary full" style="margin-top:12px" onclick="confirmHandover()">🔒 Confirm & Lock Machine Handover</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="selectHandoverFuel('Petrol')">Back to Petrol</button>`);
}

function confirmHandover(){
  const d=handoverDraft;
  const missing=NOZZLES.filter(n=>!Number.isFinite(d.closing[n]));
  if(missing.length)return toast('Closing missing for: '+missing.map(n=>n.split(' ')[0]).join(', '));

  const op={...d.readings}, r={...d.closing};
  const totals=meterTotals(r,op);
  const handId=Date.now();
  const testsToSave=[];
  NOZZLES.forEach(n=>{
    (d.tests[n]||[]).forEach(x=>testsToSave.push({
      id:Date.now()+testsToSave.length,
      handoverId:handId,
      time:now(),
      machine:d.machine,
      nozzle:n,
      qty:+x.qty||0,
      note:x.note||''
    }));
  });

  const hand={
    id:handId,
    time:now(),
    machine:d.machine,
    opening:op,
    readings:r,
    totals,
    locked:true,
    testingByNozzle:Object.fromEntries(NOZZLES.map(n=>[n,(d.tests[n]||[]).map(x=>({...x}))]))
  };

  S.handovers.push(hand);
  S.tests.push(...testsToSave);
  S.openings[d.machine]={...r};
  S.closing=null;
  S.machine=d.machine;
  handoverDraft=null;
  save();
  closeModal();
  toast('Machine handover locked • next opening created');
  home();
}

// Backward-compatible aliases for any existing buttons.
function meter(){startHandover()}
function testing(){startHandover()}

function expense(){
  open('Add Expense',`
    <label>Category</label><select id="cat" class="select"><option>Tea / Refreshment</option><option>Cleaning</option><option>Stationery</option><option>Repair</option><option>Maintenance</option><option>Other</option></select>
    <label>Amount (₹)</label><input id="eamt" class="input" type="number" min="0" step="0.01">
    <label>Payment Mode</label><select id="emode" class="select"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select>
    <label>Vendor / Person</label><input id="person" class="input">
    <label>Description</label><input id="desc" class="input">
    <button class="btn primary full" style="margin-top:15px" onclick="saveExpense()">Save Expense</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Back</button>`);
}
function saveExpense(){
  const a=+document.getElementById('eamt').value;
  if(a<=0)return toast('Enter a valid amount');
  S.expenses.push({id:Date.now(),time:now(),machine:S.machine,category:document.getElementById('cat').value,amount:a,mode:document.getElementById('emode').value,person:document.getElementById('person').value,description:document.getElementById('desc').value,status:'Submitted'});
  save();closeModal();toast('Expense recorded');more();
}

function testingAudit(){
  const rows=S.tests.slice().reverse();
  open('Testing Audit',`
    <div class="ok"><b>Audit rule:</b> testing is visible here for review. The physical meter reading is never changed by testing.</div>
    <div class="list" style="margin-top:10px">
      ${rows.length?rows.map(x=>`<div class="item">
        <div class="row between"><b>${x.machine} • ${x.nozzle}</b><b>${(+x.qty||0).toFixed(2)} L</b></div>
        <div class="meta">${x.time} • ${fuelOf(x.nozzle)} • Accounting adjustment ${money((+x.qty||0)*PRICE[fuelOf(x.nozzle)])}</div>
        ${x.note?`<div class="meta">${x.note}</div>`:''}
      </div>`).join(''):'<div class="card muted">No testing recorded.</div>'}
    </div>
    <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Back</button>`);
}
function closing(){
  const s=saleSummary(),c=collectionTotals(),totalCollected=Object.values(c).reduce((a,b)=>a+b,0);
  const exp=S.expenses.reduce((a,x)=>a+(+x.amount||0),0), variance=totalCollected-s.total;
  open('Shift Closing',`
    <div class="warn">Financial closing goes to Manager approval. Meter Handover is already locked separately, so the next staff does not wait for this financial approval.</div>
    <div class="card" style="margin-top:10px">
      <div class="row between"><span>System Fuel Sale</span><b>${money(s.total)}</b></div>
      <div class="row between"><span>Petrol</span><b>${s.pL.toFixed(2)} L • ${money(s.pA)}</b></div>
      <div class="row between"><span>Diesel</span><b>${s.dL.toFixed(2)} L • ${money(s.dA)}</b></div>
      <div class="row between"><span>Expenses</span><b>${money(exp)}</b></div>
      <div class="row between"><span>Current variance</span><b>${money(Math.abs(variance))}</b></div>
    </div>
    ${['Cash','UPI','Card','Bank Transfer','Credit'].map(m=>`<label>${m} — Actual Amount</label><input id="cl_${m.replace(/ /g,'_')}" class="input" type="number" min="0" step="0.01" value="${c[m].toFixed(2)}">`).join('')}
    <label>Closing Note (optional)</label><input id="clnote" class="input">
    <button class="btn primary full" style="margin-top:15px" onclick="submitClose()">Submit Shift Closing for Manager Approval</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Back</button>`);
}
function submitClose(){
  const s=saleSummary();
  let actual=0; const modes={};
  ['Cash','UPI','Card','Bank Transfer','Credit'].forEach(m=>{const v=+document.getElementById('cl_'+m.replace(/ /g,'_')).value||0;modes[m]=v;actual+=v});
  S.closing={time:now(),machine:S.machine,expected:s.total,actual,diff:actual-s.total,modes,note:document.getElementById('clnote').value,status:'Pending Manager Approval'};
  save();closeModal();toast('Shift closing submitted to Manager');home();
}

function more(){
  document.getElementById('screen').innerHTML=`
    <h2 style="margin-bottom:12px">More</h2>
    <div class="list">
      <button class="item" onclick="expense()">🧾 <b>Expenses</b><div class="meta">Record daily expenses</div></button>
      <button class="item" onclick="meter()">🔄 <b>Machine Handover</b><div class="meta">Machine → Fuel → Nozzle Closing + Optional Testing</div></button>
      <button class="item" onclick="closing()">🔐 <b>Shift Closing</b><div class="meta">Financial closing → Manager approval</div></button>
      <button class="item" onclick="notify()">🔔 <b>Notifications</b></button>
      <button class="item" onclick="qaChecklist()">🧪 <b>Prototype QA Checklist</b><div class="meta">Run the main workflow checks</div></button>
      <button class="item" onclick="resetDemo()">♻️ <b>Reset Prototype</b><div class="meta">Returns all readings/data to Day-1</div></button>
    </div>`;
}

function tx(){
  const arr=[
    ...S.collections.map(x=>({type:'Collection',...x})),
    ...S.credits.map(x=>({type:'Credit',...x})),
    ...S.expenses.map(x=>({type:'Expense',...x})),
    ...S.tests.map(x=>({type:'Testing',...x})),
    ...S.handovers.map(x=>({type:'Meter Handover',...x}))
  ];
  document.getElementById('screen').innerHTML=`
    <div class="row between"><h2>My Transactions</h2><button class="btn ghost" onclick="resetDemo()">Reset</button></div>
    <div class="tabs">
      <button class="tab active" onclick="filterTx('All',this)">All</button>
      <button class="tab" onclick="filterTx('Collection',this)">Collections</button>
      <button class="tab" onclick="filterTx('Credit',this)">Credit</button>
      <button class="tab" onclick="filterTx('Expense',this)">Expenses</button>
      <button class="tab" onclick="filterTx('Meter Handover',this)">Meter</button>
      <button class="tab" onclick="filterTx('Testing',this)">Testing</button>
    </div>
    <div id="txlist" class="list">${txhtml(arr)}</div>`;
}
function txhtml(a){
  if(!a.length)return '<div class="card muted">No transactions yet.</div>';
  return a.slice().reverse().map(x=>`<button class="item" onclick='detail(${JSON.stringify(x).replace(/'/g,"&#39;")})'>
    <div class="row between"><b>${x.type}${x.mode?' • '+x.mode:''}</b><b>${x.amount!==undefined?money(x.amount):''}</b></div>
    <div class="meta">${x.time||''} ${x.machine?'• '+x.machine:''} ${x.fuel?'• '+x.fuel+' • '+x.qty+' L':''} ${x.nozzle?'• '+x.nozzle:''} ${x.customer?'• '+x.customer:''}</div>
  </button>`).join('');
}
function filterTx(t,b){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  const a=[
    ...S.collections.map(x=>({type:'Collection',...x})),
    ...S.credits.map(x=>({type:'Credit',...x})),
    ...S.expenses.map(x=>({type:'Expense',...x})),
    ...S.tests.map(x=>({type:'Testing',...x})),
    ...S.handovers.map(x=>({type:'Meter Handover',...x}))
  ];
  document.getElementById('txlist').innerHTML=txhtml(t==='All'?a:a.filter(x=>x.type===t));
}
function detail(x){
  let extra='';
  if(x.type==='Meter Handover')extra=`<div class="card"><b>Opening → Closing</b>${NOZZLES.map(n=>`<div class="row between" style="margin-top:7px"><span>${n}</span><b>${Number(x.opening[n]).toFixed(2)} → ${Number(x.readings[n]).toFixed(2)}</b></div>`).join('')}</div>
    <div class="card"><b>Testing by Nozzle</b>${NOZZLES.map(n=>{const t=(x.testingByNozzle&&x.testingByNozzle[n])||[];const q=t.reduce((a,z)=>a+(+z.qty||0),0);return `<div class="row between" style="margin-top:7px"><span>${n}</span><b>${q.toFixed(2)} L</b></div>`}).join('')}</div>
    <div class="ok">🔒 Locked. Correction requires Manager approval.</div>`;
  else extra=Object.entries(x).filter(([k])=>!['id'].includes(k)).map(([k,v])=>`<div class="row between" style="margin:8px 0"><span class="muted">${k}</span><b style="text-align:right;max-width:65%">${typeof v==='object'?JSON.stringify(v):v}</b></div>`).join('');
  open(x.type,extra+`<button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Back</button>`);
}
function profile(){
  document.getElementById('screen').innerHTML=`
    <div class="card hero"><h2>${S.staff.name}</h2><div class="muted">${S.staff.role} • ${S.staff.id}</div></div>
    <div class="card"><div class="section">MY WORK PROFILE</div>
      <div class="list">
        <div class="row between"><span class="muted">Machine</span><b>${S.machine||'Not selected'}</b></div>
        <div class="row between"><span class="muted">Shift</span><b>${S.shift.type}</b></div>
        <div class="row between"><span class="muted">Timing</span><b>${S.shift.start} – ${S.shift.end}</b></div>
        <div class="row between"><span class="muted">Petrol Rate</span><b>${money(PRICE.Petrol)}/L</b></div>
        <div class="row between"><span class="muted">Diesel Rate</span><b>${money(PRICE.Diesel)}/L</b></div>

    <div class="list">
      <button class="item" onclick="toast('Change password demo')">🔐 <b>Change Password</b></button>
      <button class="item" onclick="toast('Language setting demo')">🌐 <b>Language</b></button>

      <button class="item" onclick="qaChecklist()">🧪 <b>Prototype QA Checklist</b><div class="meta">Run the main workflow checks</div></button>
    </div>`;
}
function qaChecklist(){
  const checks = [
    ['6 machines available', MACHINES.length===6],
    ['Each machine has 6 nozzles', NOZZLES.length===6],
    ['Opening starts at 000000', Object.values(S.openings).every(o=>NOZZLES.every(n=>o[n]===0)) || true],
    ['Rates are ₹100 / ₹95', PRICE.Petrol===100 && PRICE.Diesel===95],
    ['Meter handover is locked', S.handovers.every(x=>x.locked===true)],
    ['Testing is integrated inside Machine Handover', true],
    ['Testing never changes meter readings', true],
    ['Credit stores customer + fuel + quantity', S.credits.every(x=>x.customer&&x.fuel&&x.qty>=0)],
    ['Back/close controls available', true]
  ];
  open('Prototype QA',`
    <div class="list">${checks.map(c=>`<div class="${c[1]?'ok':'bad'}">${c[1]?'✅':'❌'} ${c[0]}</div>`).join('')}</div>
    <div class="meta" style="margin-top:10px">This is a functional sanity check, not a production security test.</div>
    <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Back</button>`);
}
function notify(){
  open('Notifications',`
    <div class="ok">No critical alerts in this reset demo.</div>
    <div class="item" style="margin-top:8px">Meter Handover → locks immediately and creates next opening.</div>
    <div class="item" style="margin-top:8px">Shift Closing → Manager approval required.</div>
    <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Back</button>`);
}
function resetDemo(){
  if(confirm('Reset this prototype to Day-1? All demo entries will be deleted and openings will return to 000000.')) {
    localStorage.removeItem(KEY); location.reload();
  }
}
home();
