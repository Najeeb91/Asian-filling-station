<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PumpOS — Petrol Pump Management</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e7ec;--brand:#0b6b62;--brand2:#07564f;--ok:#067647;--warn:#b54708;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#101828;color:white;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.sub{font-size:11px;color:#d0d5dd}.top button{background:#344054;color:#fff;border:0;border-radius:9px;padding:9px 11px}main{max-width:1250px;margin:auto;padding:14px 14px 92px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.nav button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.nav button.active{background:var(--brand);border-color:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.metric{font-size:24px;font-weight:800;margin-top:4px}.label{font-size:12px;color:var(--muted)}.section{font-size:16px;font-weight:800;margin:18px 0 9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.primary,.secondary,.danger{border:0;border-radius:9px;padding:9px 12px}.primary{background:var(--brand);color:white}.secondary{background:#eaecf0;color:#344054}.danger{background:#fee4e2;color:var(--bad)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#dcfae6;color:var(--ok);font-size:10px;font-weight:800}.pill.warn{background:#fef0c7;color:var(--warn)}.pill.bad{background:#fee4e2;color:var(--bad)}.notice{background:#eff8ff;border:1px solid #b2ddff;color:#175cd3;padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:12px}.alert{padding:9px 11px;border-radius:9px;margin:6px 0;font-size:12px;background:#fff7ed;color:#9a3412}.empty{color:var(--muted);font-size:13px;padding:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:19;display:flex;justify-content:center;gap:5px;padding:7px}.bottom button{border:0;background:#fff;padding:7px 10px;border-radius:8px}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end}.modalbox{background:#fff;width:min(850px,100%);max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eaecf0;border-radius:50%;width:34px;height:34px}.small{font-size:11px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:560px){.form{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.metric{font-size:19px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">PumpOS</div><div class="sub" id="stationSub">Petrol Pump Management</div></div><button onclick="settings()">⚙ Settings</button></header>
<main><div class="nav" id="nav"></div><div id="view"></div></main>
<div class="bottom"><button onclick="exportData()">Backup</button><button onclick="importData()">Restore</button><button onclick="resetData()">Reset Demo</button></div>
<input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restoreFile(event)">
<div id="modal"></div>
<script>
const KEY="pumpos_modified_v1";
const defaults={
 settings:{station:"Asian Filling Station",currency:"INR",role:"Owner",
  sales:{target:150000},fuel:{petrolBuy:90,petrolSell:94.72,dieselBuy:82,dieselSell:87.62,lowStock:1000},
  ledger:{creditLimit:50000,creditDays:30},expenses:{approvalLimit:10000},cash:{opening:0},recon:{tolerance:10}},
 sales:[],purchases:[],ledger:[],expenses:[],cash:[],bank:[],fuel:[],staff:[],audit:[]
};
let S=load(), page="dashboard";
const pages=[["dashboard","📊","Dashboard"],["sales","💳","Sales"],["fuel","⛽","Fuel"],["purchase","🧾","Purchase"],["ledger","👥","Ledger"],["expenses","💰","Expenses"],["cashbank","🏦","Cash/Bank"],["closing","🔒","Daily Closing"],["reports","📈","Reports"]];
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(defaults)}catch(e){return clone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function id(){return crypto.randomUUID()}
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:S.settings.currency||"INR",maximumFractionDigits:2}).format(Number(n)||0)}
function sum(a,f){return a.reduce((x,y)=>x+Number(f(y)||0),0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function audit(action,detail){S.audit.unshift({id:id(),time:new Date().toISOString(),action,detail});save()}
function nav(){document.getElementById("nav").innerHTML=pages.map(p=>`<button class="${page===p[0]?"active":""}" onclick="go('${p[0]}')">${p[1]} ${p[2]}</button>`).join("")}
function go(p){page=p;nav();render()}
function render(){nav();stationSub.textContent=(S.settings.station||"Petrol Pump")+" • "+(S.settings.role||"Owner");({dashboard,sales,fuel,purchase,ledger,expenses,cashbank,closing,reports}[page]||dashboard)(view)}
function dashboard(v){
 let d=today(), sd=S.sales.filter(x=>x.date===d), pd=sum(sd,x=>x.total), cash=sum(sd.filter(x=>x.pay==="Cash"),x=>x.total), digital=sum(sd.filter(x=>["UPI","Card","Bank"].includes(x.pay)),x=>x.total), credit=sum(sd.filter(x=>x.pay==="Credit"),x=>x.total), ex=sum(S.expenses.filter(x=>x.date===d),x=>x.amount);
 let alerts=[]; for(const f of ["Petrol","Diesel"]){let rows=S.fuel.filter(x=>x.date===d&&x.fuel===f);let close=rows.length?rows[rows.length-1].closing:null;if(close!==null&&close<S.settings.fuel.lowStock)alerts.push(`${f} stock is low (${close})`)}
 let outstanding=sum(S.ledger,x=>x.balance); if(outstanding>S.settings.ledger.creditLimit*3)alerts.push("Outstanding customer credit is high"); 
 v.innerHTML=`<div class="notice"><b>Simple daily control centre.</b> Record transactions once, then use Daily Closing and Reports to check the whole station.</div>
 <div class="grid">${[["Today sales",money(pd)],["Cash sales",money(cash)],["Digital",money(digital)],["Credit sales",money(credit)],["Expenses",money(ex)],["Net",money(pd-ex)],["Customer outstanding",money(outstanding)],["Transactions",sd.length]].map(a=>`<div class="card"><div class="label">${a[0]}</div><div class="metric">${a[1]}</div></div>`).join("")}</div>
 <div class="section">Important alerts</div><div class="card">${alerts.length?alerts.map(a=>`<div class="alert">⚠ ${esc(a)}</div>`).join(""):"<span class='pill'>No critical alerts</span>"}</div>
 <div class="section">Quick actions</div><div class="grid">${pages.slice(1).map(p=>`<div class="card" onclick="go('${p[0]}')"><div style="font-size:22px">${p[1]}</div><b>${p[2]}</b><div class="small">Open →</div></div>`).join("")}</div>`;
}
function sales(v){
 v.innerHTML=`<div class="section">Record sale</div><div class="card"><div class="form">
 ${field("sdate","Date","date",today())}${select("sfuel","Fuel type",["Petrol","Diesel"])}${field("sqty","Quantity","number","")}
 ${field("srate","Sale rate","number",S.settings.fuel.petrolSell)}${select("spay","Payment",["Cash","UPI","Card","Credit","Bank","Other"])}${field("scustomer","Customer / party","text","")}
 </div><div class="actions"><button class="primary" onclick="addSale()">Save sale</button></div></div>
 <div class="section">Transactions</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date/time</th><th>Fuel</th><th>Qty</th><th>Rate</th><th>Amount</th><th>Payment</th><th>Customer</th><th></th></tr></thead><tbody>${S.sales.map(x=>`<tr><td>${x.date}<br>${new Date(x.created).toLocaleTimeString()}</td><td>${x.fuel}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.total)}</td><td>${x.pay}</td><td>${esc(x.customer)}</td><td><button class="danger" onclick="del('sales','${x.id}')">Delete</button></td></tr>`).join("")||row("No sales yet.",8)}</tbody></table></div>`;
}
function addSale(){let q=+sqty.value,r=+srate.value;if(q<=0||r<0)return alert("Enter quantity and rate.");let x={id:id(),date:sdate.value,fuel:sfuel.value,qty:q,rate:r,total:q*r,pay:spay.value,customer:scustomer.value,created:new Date().toISOString()};S.sales.unshift(x);audit("Sale recorded",`${x.fuel} ${q} @ ${r}, ${x.pay}`);render()}
function fuel(v){
 let last=(f)=>{let a=S.fuel.filter(x=>x.fuel===f).sort((a,b)=>a.date.localeCompare(b.date));return a.length?a[a.length-1].closing:0};
 v.innerHTML=`<div class="grid">${["Petrol","Diesel"].map(f=>`<div class="card"><div class="label">${f} closing stock</div><div class="metric">${last(f)}</div></div>`).join("")}<div class="card"><div class="label">Petrol sale rate</div><div class="metric">${money(S.settings.fuel.petrolSell)}</div></div><div class="card"><div class="label">Diesel sale rate</div><div class="metric">${money(S.settings.fuel.dieselSell)}</div></div></div>
 <div class="section">Daily fuel stock</div><div class="card"><div class="form">${field("fdate","Date","date",today())}${select("ffuel","Fuel",["Petrol","Diesel"])}${field("fopen","Opening stock","number","0")}${field("frecv","Fuel received","number","0")}${field("fsold","Fuel sold","number","0")}${field("fclose","Closing stock","number","0")}${field("fbuy","Buy rate","number",S.settings.fuel.petrolBuy)}${field("fsell","Sale rate","number",S.settings.fuel.petrolSell)}</div><div class="actions"><button class="primary" onclick="addFuel()">Save fuel day</button></div></div>
 <div class="section">Fuel reconciliation</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Fuel</th><th>Opening</th><th>Received</th><th>Sold</th><th>Expected close</th><th>Actual close</th><th>Difference</th><th>Stock value</th></tr></thead><tbody>${S.fuel.map(x=>{let e=x.opening+x.received-x.sold,d=x.closing-e;return `<tr><td>${x.date}</td><td>${x.fuel}</td><td>${x.opening}</td><td>${x.received}</td><td>${x.sold}</td><td>${e}</td><td>${x.closing}</td><td><span class="pill ${Math.abs(d)>S.settings.recon.tolerance?"bad":""}">${d.toFixed(2)}</span></td><td>${money(x.closing*x.buy)}</td></tr>`}).join("")||row("No fuel records.",9)}</tbody></table></div>`;
}
function addFuel(){let o=+fopen.value,r=+frecv.value,s=+fsold.value,c=+fclose.value;if([o,r,s,c].some(x=>x<0))return alert("Values cannot be negative.");let x={id:id(),date:fdate.value,fuel:ffuel.value,opening:o,received:r,sold:s,closing:c,buy:+fbuy.value||0,sell:+fsell.value||0};S.fuel.unshift(x);audit("Fuel stock saved",`${x.fuel} ${x.date}`);render()}
function purchase(v){
 v.innerHTML=`<div class="section">Fuel receipt / purchase</div><div class="card"><div class="form">${field("pdate","Date","date",today())}${field("psupplier","Supplier","text","")}${field("pinvoice","Invoice number","text","")}${select("pfuel","Fuel",["Petrol","Diesel"])}${field("pqty","Quantity","number","")}${field("prate","Purchase rate","number","0")}${field("pcharge","Transport/other charges","number","0")}${select("pstatus","Payment status",["Paid","Pending","Part-paid"])}</div><div class="actions"><button class="primary" onclick="addPurchase()">Save purchase</button></div></div>
 <div class="section">Purchases</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Supplier</th><th>Invoice</th><th>Fuel</th><th>Qty</th><th>Rate</th><th>Total</th><th>Status</th></tr></thead><tbody>${S.purchases.map(x=>`<tr><td>${x.date}</td><td>${esc(x.supplier)}</td><td>${esc(x.invoice)}</td><td>${x.fuel}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.total)}</td><td><span class="pill ${x.status==="Pending"?"warn":""}">${x.status}</span></td></tr>`).join("")||row("No purchases.",8)}</tbody></table></div>`;
}
function addPurchase(){let q=+pqty.value,r=+prate.value,c=+pcharge.value;if(q<=0||r<0)return alert("Enter quantity and purchase rate.");let x={id:id(),date:pdate.value,supplier:psupplier.value,invoice:pinvoice.value,fuel:pfuel.value,qty:q,rate:r,charges:c,total:q*r+c,status:pstatus.value};S.purchases.unshift(x);audit("Fuel purchase recorded",`${x.fuel} ${q} from ${x.supplier}`);render()}
function ledger(v){
 v.innerHTML=`<div class="section">Customer / credit ledger</div><div class="card"><div class="form">${field("lname","Customer name","text","")}${field("lphone","Phone / code","text","")}${field("lopen","Opening balance","number","0")}${field("llimit","Credit limit","number",S.settings.ledger.creditLimit)}</div><div class="actions"><button class="primary" onclick="addLedger()">Add customer</button></div></div>
 <div class="section">Outstanding</div><div class="card tablewrap"><table class="table"><thead><tr><th>Customer</th><th>Code</th><th>Opening</th><th>Credit</th><th>Payments</th><th>Outstanding</th><th>Limit</th><th>Status</th></tr></thead><tbody>${S.ledger.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${money(x.opening)}</td><td>${money(x.credit)}</td><td>${money(x.payments)}</td><td>${money(x.balance)}</td><td>${money(x.limit)}</td><td><span class="pill ${x.balance>x.limit?"bad":""}">${x.balance>x.limit?"OVER":"OK"}</span></td></tr>`).join("")||row("No customers.",8)}</tbody></table></div>`;
}
function addLedger(){if(!lname.value.trim())return alert("Enter customer name.");let o=+lopen.value||0,x={id:id(),name:lname.value.trim(),code:lphone.value,opening:o,credit:0,payments:0,balance:o,limit:+llimit.value||0};S.ledger.push(x);audit("Customer ledger added",x.name);render()}
function expenses(v){
 v.innerHTML=`<div class="section">Expense entry</div><div class="card"><div class="form">${field("edate","Date","date",today())}${field("ecat","Category","text","")}${field("eamt","Amount","number","")}${select("epay","Payment",["Cash","UPI","Card","Bank","Other"])}${field("eperson","Person / vendor","text","")}${field("edesc","Description","text","")}</div><div class="actions"><button class="primary" onclick="addExpense()">Save expense</button></div></div>
 <div class="section">Expense summary</div><div class="card"><b>${money(sum(S.expenses.filter(x=>x.date===today()),x=>x.amount))}</b> today</div>
 <div class="section">Expense ledger</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Payment</th><th>Vendor/person</th><th>Description</th></tr></thead><tbody>${S.expenses.map(x=>`<tr><td>${x.date}</td><td>${esc(x.cat)}</td><td>${money(x.amount)}</td><td>${x.pay}</td><td>${esc(x.person)}</td><td>${esc(x.desc)}</td></tr>`).join("")||row("No expenses.",6)}</tbody></table></div>`;
}
function addExpense(){let a=+eamt.value;if(a<=0)return alert("Enter amount.");let x={id:id(),date:edate.value,cat:ecat.value||"Other",amount:a,pay:epay.value,person:eperson.value,desc:edesc.value};S.expenses.unshift(x);audit("Expense recorded",`${x.cat} ${a}`);render()}
function cashbank(v){
 let d=today(),salesCash=sum(S.sales.filter(x=>x.date===d&&x.pay==="Cash"),x=>x.total),expCash=sum(S.expenses.filter(x=>x.date===d&&x.pay==="Cash"),x=>x.amount),deposit=sum(S.cash.filter(x=>x.date===d),x=>x.deposit),expected=(+S.settings.cash.opening||0)+salesCash-expCash-deposit;
 v.innerHTML=`<div class="grid"><div class="card"><div class="label">Opening cash</div><div class="metric">${money(S.settings.cash.opening)}</div></div><div class="card"><div class="label">Cash sales</div><div class="metric">${money(salesCash)}</div></div><div class="card"><div class="label">Cash expenses</div><div class="metric">${money(expCash)}</div></div><div class="card"><div class="label">Expected closing</div><div class="metric">${money(expected)}</div></div></div>
 <div class="section">Cash / deposit</div><div class="card"><div class="form">${field("cdate","Date","date",today())}${field("cdep","Cash deposited","number","0")}${field("cactual","Actual cash counted","number","0")}${select("cbank","Deposit bank",["Bank","Other"])}${field("cref","Reference","text","")}</div><div class="actions"><button class="primary" onclick="addCash()">Save cash closing</button></div></div>
 <div class="section">Bank & digital reconciliation</div><div class="card"><div class="form">${field("bdt","Date","date",today())}${select("btype","Type",["UPI","Card","Bank"])}${field("bexpected","Expected amount","number","0")}${field("bactual","Actual/settled amount","number","0")}${field("bref","Reference","text","")}</div><div class="actions"><button class="primary" onclick="addBank()">Save reconciliation</button></div></div>
 <div class="section">Recent records</div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Deposit</th><th>Actual cash</th><th>Bank</th><th>Reference</th></tr></thead><tbody>${S.cash.map(x=>`<tr><td>${x.date}</td><td>${money(x.deposit)}</td><td>${money(x.actual)}</td><td>${x.bank}</td><td>${esc(x.ref)}</td></tr>`).join("")||row("No cash records.",5)}</tbody></table></div>`;
}
function addCash(){let x={id:id(),date:cdate.value,deposit:+cdep.value||0,actual:+cactual.value||0,bank:cbank.value,ref:cref.value};S.cash.unshift(x);audit("Cash closing saved",x.date);render()}
function addBank(){let e=+bexpected.value||0,a=+bactual.value||0;let x={id:id(),date:bdt.value,type:btype.value,expected:e,actual:a,ref:bref.value};S.bank.unshift(x);audit("Digital reconciliation saved",`${x.type}: ${a-e}`);alert(`Difference: ${money(a-e)}`)}
function closing(v){
 let d=today(),sd=S.sales.filter(x=>x.date===d), total=sum(sd,x=>x.total),cash=sum(sd.filter(x=>x.pay==="Cash"),x=>x.total),digital=sum(sd.filter(x=>["UPI","Card","Bank"].includes(x.pay)),x=>x.total),credit=sum(sd.filter(x=>x.pay==="Credit"),x=>x.total),exp=sum(S.expenses.filter(x=>x.date===d),x=>x.amount),dep=sum(S.cash.filter(x=>x.date===d),x=>x.deposit),open=+S.settings.cash.opening||0,expected=open+cash-sum(S.expenses.filter(x=>x.date===d&&x.pay==="Cash"),x=>x.amount)-dep,actual=S.cash.find(x=>x.date===d)?.actual??0;
 v.innerHTML=`<div class="notice"><b>Daily Closing</b> is the final daily checkpoint. Review the numbers before treating the day as closed.</div><div class="grid">${[["Total fuel sold",sum(sd,x=>x.qty).toFixed(2)],["Total sales",money(total)],["Cash",money(cash)],["Digital",money(digital)],["Credit",money(credit)],["Expenses",money(exp)],["Cash deposited",money(dep)],["Expected cash",money(expected)],["Actual cash",money(actual)],["Cash difference",money(actual-expected)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join("")}</div>
 <div class="section">Closing checks</div><div class="card">${Math.abs(actual-expected)<=S.settings.recon.tolerance?`<span class="pill">Cash OK</span>`:`<span class="pill bad">Cash mismatch</span>`} &nbsp; <span class="small">Tolerance ${money(S.settings.recon.tolerance)}</span><div class="actions"><button class="primary" onclick="closeDay()">Confirm daily closing</button></div></div>`
}
function closeDay(){audit("Daily closing confirmed",today());alert("Daily closing recorded in audit log.");render()}
function reports(v){
 v.innerHTML=`<div class="section">Reports</div><div class="card"><div class="form">${field("rfrom","From","date",today())}${field("rto","To","date",today())}</div><div class="actions"><button class="primary" onclick="makeReport()">Generate report</button></div></div><div id="report" class="section"></div>`
}
function makeReport(){let f=rfrom.value,t=rto.value,sd=S.sales.filter(x=>x.date>=f&&x.date<=t),ex=S.expenses.filter(x=>x.date>=f&&x.date<=t),pu=S.purchases.filter(x=>x.date>=f&&x.date<=t),fu=S.fuel.filter(x=>x.date>=f&&x.date<=t);let sales=sum(sd,x=>x.total),expense=sum(ex,x=>x.amount),purchase=sum(pu,x=>x.total),qty=sum(sd,x=>x.qty),margin=sales-purchase-expense;report.innerHTML=`<div class="card"><h3>${f} → ${t}</h3><div class="grid">${[["Sales",money(sales)],["Fuel quantity",qty.toFixed(2)],["Purchases",money(purchase)],["Expenses",money(expense)],["Net / indicative margin",money(margin)],["Transactions",sd.length],["Fuel records",fu.length],["Outstanding",money(sum(S.ledger,x=>x.balance))]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join("")}</div></div>`}
function settings(){
 let d=S.settings;
 modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>Settings</h2><button class="close" onclick="closeModal()">×</button></div><p class="small">Department-specific settings. Edit and save; reset all settings only when required.</p>
 <div class="form">${field("setstation","Station name","text",d.station)}${select("setrole","User role",["Owner","Manager","Staff"],d.role)}${field("settarget","Sales daily target","number",d.sales.target)}${field("setpb","Petrol buy rate","number",d.fuel.petrolBuy)}${field("setps","Petrol sale rate","number",d.fuel.petrolSell)}${field("setdb","Diesel buy rate","number",d.fuel.dieselBuy)}${field("setds","Diesel sale rate","number",d.fuel.dieselSell)}${field("setlow","Low stock alert level","number",d.fuel.lowStock)}${field("setlimit","Customer credit limit","number",d.ledger.creditLimit)}${field("setdays","Credit days","number",d.ledger.creditDays)}${field("setapproval","Expense approval limit","number",d.expenses.approvalLimit)}${field("setopening","Opening cash","number",d.cash.opening)}${field("settolerance","Reconciliation tolerance","number",d.recon.tolerance)}</div>
 <div class="actions"><button class="primary" onclick="saveSettings()">Save settings</button><button class="secondary" onclick="resetSettings()">Reset settings</button></div></div></div>`
}
function saveSettings(){S.settings.station=setstation.value||"Petrol Pump";S.settings.role=setrole.value;S.settings.sales.target=+settarget.value||0;S.settings.fuel.petrolBuy=+setpb.value||0;S.settings.fuel.petrolSell=+setps.value||0;S.settings.fuel.dieselBuy=+setdb.value||0;S.settings.fuel.dieselSell=+setds.value||0;S.settings.fuel.lowStock=+setlow.value||0;S.settings.ledger.creditLimit=+setlimit.value||0;S.settings.ledger.creditDays=+setdays.value||0;S.settings.expenses.approvalLimit=+setapproval.value||0;S.settings.cash.opening=+setopening.value||0;S.settings.recon.tolerance=+settolerance.value||0;audit("Settings updated","Station and department settings");closeModal();render()}
function resetSettings(){if(!confirm("Reset all settings to defaults?"))return;S.settings=clone(defaults.settings);audit("Settings reset","Default settings restored");closeModal();render()}
function closeModal(){modal.innerHTML=""}
function del(k,i){if(!confirm("Delete this entry?"))return;S[k]=S[k].filter(x=>x.id!==i);audit("Entry deleted",k);render()}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`pumpos-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(){restoreFile.click()}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.sales)throw Error();S=x;save();render();alert("Backup restored.")}catch(err){alert("Invalid PumpOS backup file.")}};r.readAsText(f)}
function resetData(){if(!confirm("Delete all demo data and restore blank PumpOS?"))return;S=clone(defaults);save();audit("System reset","Demo data reset");render()}
function field(id,label,type,value){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function select(id,label,opts,value){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${value===o?"selected":""}>${o}</option>`).join("")}</select></div>`}
function row(text,n){return `<tr><td colspan="${n}" class="empty">${text}</td></tr>`}
save();render();
</script>
</body>
</html>
