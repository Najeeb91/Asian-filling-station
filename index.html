<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Asian Filling Station v0.2</title>
<style>body{font:16px Arial;background:#f4f6f9;margin:0;color:#172033}.w{max-width:650px;margin:auto;padding:18px}.c{background:white;padding:16px;margin:12px 0;border-radius:14px}button{padding:11px;margin:4px;border:0;border-radius:9px;background:#0b5ed7;color:white;font-weight:bold}input,select{width:100%;padding:11px;margin:6px 0 12px;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}.r{text-align:right}.hide{display:none}.red{color:#b42318}.green{color:#087443}</style>
<div class=w><h2>⛽ Asian Filling Station</h2><p>Customer Ledger Practice — v0.2</p><div class=c><button onclick="formC()">+ Customer</button><button onclick="formT()">+ Transaction</button><button onclick="demo()">Practice Example</button><button onclick="resetAll()">Reset</button></div><div class=c><h3>Customers</h3><div id=list></div></div><div id=form class="c hide"></div><div id=ledger class="c hide"></div></div>
<script>
let D=JSON.parse(localStorage.afs02||'{"c":[],"t":[]}'),sel=null;
const M=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n),id=()=>Date.now()+Math.random();
function save(){localStorage.afs02=JSON.stringify(D);render()}
function B(c){return D.t.filter(x=>x.c==c.id).reduce((s,x)=>s+(x.type=='credit'?x.a:-x.a),0)}
function esc(s){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function render(){list.innerHTML=D.c.length?D.c.map(c=>`<p><b>${esc(c.n)}</b> — <span class="${B(c)>0?'red':'green'}">${M(B(c))}</span> <button onclick="ledger(${c.id})">Open Ledger</button></p>`).join(''):'No customers yet.';if(sel)ledger(sel)}
function formC(){form.classList.remove('hide');form.innerHTML='<h3>Add Customer</h3>Name<input id=n placeholder="Customer name">Opening balance<input id=o type=number value=0><button onclick=addC()>Save</button>'}
function addC(){let n=document.getElementById('n').value.trim(),o=+document.getElementById('o').value||0;if(!n)return alert('Enter a name');let c={id:id(),n};D.c.push(c);if(o)D.t.push({c:c.id,type:'credit',a:o,d:'Opening balance',dt:new Date().toISOString()});sel=c.id;save();form.classList.add('hide')}
function formT(){if(!D.c.length)return alert('Add a customer first');form.classList.remove('hide');form.innerHTML='<h3>Add Transaction</h3>Customer<select id=c>'+D.c.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')+'</select>Type<select id=y><option value=credit>Fuel on Credit</option><option value=payment>Payment Received</option></select>Amount<input id=a type=number min=1>Description<input id=d placeholder="Diesel / payment"><button onclick=addT()>Save</button>'}
function addT(){let c=+document.getElementById('c').value,a=+document.getElementById('a').value||0,y=document.getElementById('y').value;if(!a)return alert('Enter amount');D.t.push({c,type:y,a,d:document.getElementById('d').value||(y=='credit'?'Fuel on credit':'Payment received'),dt:new Date().toISOString()});sel=c;save();form.classList.add('hide')}
function ledger(cid){sel=cid;let c=D.c.find(x=>x.id==cid),b=0,rows=D.t.filter(x=>x.c==cid).sort((a,b)=>new Date(a.dt)-new Date(b.dt)).map(x=>{let de=x.type=='credit'?x.a:0,cr=x.type=='payment'?x.a:0;b+=de-cr;return `<tr><td>${new Date(x.dt).toLocaleDateString('en-IN')}</td><td>${esc(x.d)}</td><td>${de?M(de):'—'}</td><td>${cr?M(cr):'—'}</td><td>${M(b)}</td></tr>`}).join('');ledger.classList.remove('hide');ledger.innerHTML=`<h3>${esc(c.n)}</h3><h2 class="${B(c)>0?'red':'green'}">${M(B(c))}</h2><p>Current outstanding</p><table><tr><th>Date</th><th>Particular</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>${rows}</table>`}
function demo(){let c={id:id(),n:'Practice Customer'};D.c.push(c);D.t.push({c:c.id,type:'credit',a:50000,d:'Opening balance',dt:new Date(Date.now()-172800000).toISOString()},{c:c.id,type:'credit',a:10000,d:'Diesel on credit',dt:new Date(Date.now()-86400000).toISOString()},{c:c.id,type:'payment',a:20000,d:'Payment received',dt:new Date().toISOString()});sel=c.id;save()}
function resetAll(){if(confirm('Delete practice data?')){D={c:[],t:[]};sel=null;localStorage.removeItem('afs02');render();ledger.classList.add('hide')}}
render();
</script>
