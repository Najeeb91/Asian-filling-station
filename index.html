<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2a52"><title>PumpOS Staff Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#10213b;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#0b2a52}.brand i{color:#f59e0b;font-style:normal}button,input,select{font:inherit}button{cursor:pointer}.icon{border:0;background:#f1f3f6;border-radius:13px;width:42px;height:42px}main{padding:14px}.card,.item,.stat,.action{background:#fff;border:1px solid #e5e7eb;border-radius:17px}.card{padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#0b2a52,#19579a);color:#fff;border:0}.hero .muted{color:#dbeafe}.muted{color:#6b7280}.small{font-size:12px}.bold{font-weight:800}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px}.stat .v{font-size:19px;font-weight:900;margin-top:7px}.stat .s{font-size:11px;color:#6b7280;margin-top:3px}.section{font-weight:900;margin:8px 2px 9px}.action{padding:13px 8px;text-align:center;min-height:96px}.action .ico{font-size:25px}.action b{display:block;font-size:12px;margin-top:6px}.action small{color:#6b7280;font-size:10px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:#0b2a52;color:white}.ghost{background:#f1f3f6;color:#10213b}.full{width:100%}.ok,.bad,.warn{padding:10px 12px;border-radius:13px;font-size:13px}.ok{background:#ecfdf3;color:#087a31}.bad{background:#fef2f2;color:#a91b1b}.warn{background:#fff7ed;color:#9a5700}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 7px env(safe-area-inset-bottom);z-index:20}.nav{border:0;background:transparent;color:#667085;border-radius:12px;padding:6px;font-size:11px}.nav div{font-size:21px}.nav.active{background:#eef4ff;color:#2563eb;font-weight:800}.sheetbg{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end}.sheet{background:white;width:100%;max-width:520px;max-height:92vh;overflow:auto;margin:auto 0 0;border-radius:24px 24px 0 0;padding:17px}.close{float:right;border:0;background:#f1f3f6;border-radius:50%;width:36px;height:36px}.input,.select{width:100%;padding:11px;border:1px solid #d8dde6;border-radius:11px;background:white}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.machinegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.machine{border:2px solid #e5e7eb;border-radius:15px;background:#fff;padding:12px;text-align:left}.machine.sel{border-color:#2563eb;background:#eff6ff}.noz{display:inline-block;background:#f1f3f6;border-radius:7px;padding:4px 5px;font-size:9px;margin:3px 2px 0 0}.list{display:grid;gap:8px}.item{padding:12px;text-align:left}.meta{font-size:11px;color:#6b7280;margin-top:4px}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tab{border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:7px 11px;white-space:nowrap;font-size:11px}.tab.active{background:#0b2a52;color:#fff}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:11px;z-index:100;font-size:12px}
</style></head><body><div class="app"><header><button class="icon" onclick="go('more')">☰</button><div class="brand">Pump<i>OS</i></div><button class="icon" onclick="notify()">🔔</button></header><main id="screen"></main><nav class="bottom"><button class="nav active" id="n-home" onclick="go('home')"><div>⌂</div>Home</button><button class="nav" id="n-tx" onclick="go('tx')"><div>▤</div>Transactions</button><button class="nav" id="n-more" onclick="go('more')"><div>⋮</div>More</button><button class="nav" id="n-profile" onclick="go('profile')"><div>♙</div>Profile</button></nav></div><div id="modal"></div><script>
const K='pumpos_staff_proto';let S=JSON.parse(localStorage.getItem(K)||'null')||{staff:{name:'Demo Staff',id:'ST-001',role:'Staff'},machine:'',shift:{type:'8 Hours',start:'06:00',end:'14:00'},sales:[],entries:[],expenses:[],tests:[],meters:[],closing:null};function save(){localStorage.setItem(K,JSON.stringify(S))}function money(x){return '₹'+Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}function now(){return new Date().toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}function toast(x){let t=document.createElement('div');t.className='toast';t.textContent=x;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}function go(p){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));let id=p==='tx'?'n-tx':p==='more'?'n-more':p==='profile'?'n-profile':'n-home';document.getElementById(id).classList.add('active');p==='home'?home():p==='tx'?tx():p==='more'?more():profile()}
function sums(){let s={pL:0,pA:0,dL:0,dA:0},c={Cash:0,UPI:0,Card:0,'Bank Transfer':0,Credit:0};S.sales.forEach(x=>{if(x.fuel==='Petrol'){s.pL+=+x.qty;s.pA+=+x.amount}else{s.dL+=+x.qty;s.dA+=+x.amount}});S.entries.forEach(x=>c[x.mode]=(c[x.mode]||0)+(+x.amount));return{s,c,total:Object.values(c).reduce((a,b)=>a+b,0)}}
function home(){let {s,c,total}=sums(),d=S.closing?+S.closing.diff:0;document.getElementById('screen').innerHTML=`<div class="card hero"><div class="row between"><div><div class="muted small">Good day</div><h2>${S.staff.name} 👋</h2></div><b>ACTIVE</b></div><div class="row between" style="margin-top:12px"><div><div class="muted small">My Machine</div><b style="font-size:24px">${S.machine||'Not selected'}</b></div><div style="text-align:right"><div class="muted small">Shift</div><b>${S.shift.start} – ${S.shift.end}</b></div></div><button class="btn ${S.machine?'ghost':'primary'} full" style="margin-top:12px" onclick="machines()">${S.machine?'Change Machine':'Choose Machine'}</button></div><div class="section">TODAY'S SUMMARY</div><div class="grid3"><div class="stat"><div class="small">⛽ Petrol</div><div class="v">${s.pL.toFixed(2)} L</div><div class="s">${money(s.pA)}</div></div><div class="stat"><div class="small">🛢️ Diesel</div><div class="v">${s.dL.toFixed(2)} L</div><div class="s">${money(s.dA)}</div></div><div class="stat"><div class="small">₹ Total Sale</div><div class="v" style="font-size:16px">${money(s.pA+s.dA)}</div><div class="s">Fuel sales</div></div></div><div class="card" style="margin-top:12px"><div class="row between"><div class="section" style="margin:0">COLLECTION SUMMARY</div><button class="btn ghost" onclick="go('tx')">Details</button></div><div class="list" style="margin-top:10px">${[['Cash','💵'],['UPI','📱'],['Card','💳'],['Bank Transfer','🏦'],['Credit','👤']].map(x=>`<div class="row between"><span>${x[1]} ${x[0]}</span><b>${money(c[x[0]])}</b></div>`).join('')}</div><hr style="border:0;border-top:1px solid #e5e7eb"><div class="row between"><b>Total Collection</b><b>${money(total)}</b></div><div style="margin-top:9px" class="${d===0?'ok':d<0?'bad':'ok'}">${d===0?'✅ COLLECTION MATCHED':d<0?'🔴 SHORTAGE':'🟢 EXCESS'} <b style="float:right">${money(Math.abs(d))}</b></div></div><div class="section">QUICK ACTIONS</div><div class="grid2"><button class="action" onclick="meter()"><div class="ico">🔄</div><b>Meter Handover</b><small>Close & handover</small></button><button class="action" onclick="sale('Cash')"><div class="ico">💵</div><b>Cash Entry</b><small>Record cash sale</small></button><button class="action" onclick="sale('UPI')"><div class="ico">📱</div><b>UPI / Digital</b><small>Record digital sale</small></button><button class="action" onclick="credit()"><div class="ico">👤</div><b>Credit Entry</b><small>Approved customer</small></button></div>`}
function open(title,body){document.getElementById('modal').innerHTML=`<div class="sheetbg" onclick="if(event.target===this)close()"><div class="sheet"><button class="close" onclick="close()">×</button><h2>${title}</h2>${body}</div></div>`}function close(){document.getElementById('modal').innerHTML=''}
function machines(){let a=Array.from({length:6},(_,i)=>'M-0'+(i+1));open('Choose Machine',`<div class="warn">Demo phase: all 6 machines are selectable. Manager assignment/locking will be connected later.</div><div class="machinegrid" style="margin-top:10px">${a.map(m=>`<button class="machine ${S.machine===m?'sel':''}" onclick="pick('${m}')"><b>${m}</b><div class="meta">6 nozzles</div><div>${['P1','P2','P3'].map(n=>`<span class="noz">${n} Petrol</span>`).join('')} ${['D1','D2','D3'].map(n=>`<span class="noz">${n} Diesel</span>`).join('')}</div></button>`).join('')}</div>`)}function pick(m){S.machine=m;save();close();toast(m+' selected');home()}
function sale(mode){if(!S.machine){toast('Choose a machine first');return}open(mode+' Entry',`<label>Fuel Type</label><select id="fuel" class="select"><option>Petrol</option><option>Diesel</option></select><label>Quantity (L)</label><input id="qty" class="input" type="number" step="0.01"><label>Sale Rate (₹/L)</label><input id="rate" class="input" type="number" value="105" step="0.01">${mode!=='Cash'?'<label>UTR / Reference (optional)</label><input id="ref" class="input">':''}<label>Note (optional)</label><input id="note" class="input"><button class="btn primary full" style="margin-top:15px" onclick="saveSale('${mode}')">Save Sale</button>`)}function saveSale(mode){let q=+qty.value,r=+rate.value;if(q<=0||r<=0)return toast('Enter valid quantity/rate');let x={id:Date.now(),time:now(),machine:S.machine,fuel:fuel.value,qty:q,rate:r,amount:q*r,mode,ref:document.getElementById('ref')?.value||'',note:note.value};S.sales.push(x);S.entries.push(x);save();close();toast('Sale saved '+money(q*r));home()}
function credit(){if(!S.machine)return toast('Choose a machine first');open('Credit Entry',`<div class="ok">👤 Only Manager-approved customers are available.</div><label>Customer</label><select id="cust" class="select"><option>ABC Transport — Available ₹32,000</option><option>XYZ Contractors — Available ₹18,500</option><option>Local Fleet — Available ₹12,000</option></select><label>Fuel Type</label><select id="fuel" class="select"><option>Diesel</option><option>Petrol</option></select><label>Quantity (L)</label><input id="qty" class="input" type="number" step="0.01"><label>Rate (₹/L)</label><input id="rate" class="input" value="105"><button class="btn primary full" style="margin-top:15px" onclick="saveCredit()">Save Credit Sale</button>`)}function saveCredit(){let q=+qty.value,r=+rate.value;if(q<=0||r<=0)return toast('Enter valid values');let x={id:Date.now(),time:now(),machine:S.machine,fuel:fuel.value,qty:q,rate:r,amount:q*r,mode:'Credit',customer:cust.value};S.sales.push(x);S.entries.push(x);save();close();toast('Credit sale saved');home()}
function meter(){if(!S.machine)return toast('Choose a machine first');let ns=['P1 Petrol','P2 Petrol','P3 Petrol','D1 Diesel','D2 Diesel','D3 Diesel'];open('Meter Handover — '+S.machine,`<div class="ok">Meter Closing is immediately locked. No Manager approval gate. Next staff gets these readings as Opening Meter.</div>${ns.map((n,i)=>`<label>${n} — Closing Reading</label><input id="m${i}" class="input" type="number" step="0.01">`).join('')}<button class="btn primary full" style="margin-top:15px" onclick="saveMeter()">Confirm Meter Handover</button>`)}function saveMeter(){let r=Array.from({length:6},(_,i)=>+document.getElementById('m'+i).value);if(r.some(x=>!Number.isFinite(x)||x<0))return toast('Enter all six readings');S.meters.push({id:Date.now(),time:now(),machine:S.machine,readings:r,locked:true});save();close();toast('Meter handover locked; next opening created');home()}
function tx(){let a=[...S.entries.map(x=>({type:'Sale',...x})),...S.expenses.map(x=>({type:'Expense',...x})),...S.tests.map(x=>({type:'Testing',...x})),...S.meters.map(x=>({type:'Meter Handover',...x}))];document.getElementById('screen').innerHTML=`<div class="row between"><h2>My Transactions</h2><button class="btn ghost" onclick="resetDemo()">Reset</button></div><div class="tabs"><button class="tab active" onclick="filterTx('All',this)">All</button><button class="tab" onclick="filterTx('Sale',this)">Sales</button><button class="tab" onclick="filterTx('Expense',this)">Expenses</button><button class="tab" onclick="filterTx('Meter Handover',this)">Meter</button><button class="tab" onclick="filterTx('Testing',this)">Testing</button></div><div id="txlist" class="list">${txhtml(a)}</div>`}function txhtml(a){if(!a.length)return '<div class="card muted">No transactions yet.</div>';return a.reverse().map(x=>`<button class="item" onclick='detail(${JSON.stringify(x).replace(/'/g,"&#39;")})'><div class="row between"><b>${x.type}${x.mode?' • '+x.mode:''}</b><b>${x.amount?money(x.amount):''}</b></div><div class="meta">${x.time||''} ${x.fuel?'• '+x.fuel+' • '+x.qty+' L':''} ${x.customer?'• '+x.customer:''}</div></button>`).join('')}function filterTx(t,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');let a=[...S.entries.map(x=>({type:'Sale',...x})),...S.expenses.map(x=>({type:'Expense',...x})),...S.tests.map(x=>({type:'Testing',...x})),...S.meters.map(x=>({type:'Meter Handover',...x}))];document.getElementById('txlist').innerHTML=txhtml(t==='All'?a:a.filter(x=>x.type===t))}function detail(x){open(x.type,Object.entries(x).filter(([k])=>k!=='readings').map(([k,v])=>`<div class="row between" style="margin:8px 0"><span class="muted">${k}</span><b>${v}</b></div>`).join('')+(x.locked?'<div class="ok" style="margin-top:10px">🔒 Locked. Correction requires Manager approval.</div>':''))}
function more(){document.getElementById('screen').innerHTML=`<h2 style="margin-bottom:12px">More</h2><div class="list"><button class="item" onclick="expense()">🧾 <b>Expenses</b><div class="meta">Record daily expenses</div></button><button class="item" onclick="testing()">🧪 <b>Nozzle Testing</b><div class="meta">Machine/nozzle decides fuel automatically</div></button><button class="item" onclick="closing()">🔐 <b>Shift Closing</b><div class="meta">Financial closing → Manager approval</div></button><button class="item" onclick="notify()">🔔 <b>Notifications</b></button><button class="item" onclick="toast('Help centre demo')">❓ <b>Help</b></button><button class="item" onclick="toast('Demo logout')">🚪 <b>Logout</b></button></div>`}
function expense(){open('Add Expense',`<label>Category</label><select id="cat" class="select"><option>Tea / Refreshment</option><option>Cleaning</option><option>Stationery</option><option>Repair</option><option>Maintenance</option><option>Other</option></select><label>Amount</label><input id="amt" class="input" type="number"><label>Payment Mode</label><select id="mode" class="select"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select><label>Vendor / Person</label><input id="person" class="input"><label>Description</label><input id="desc" class="input"><button class="btn primary full" style="margin-top:15px" onclick="saveExpense()">Save Expense</button>`)}function saveExpense(){let a=+amt.value;if(a<=0)return toast('Enter valid amount');S.expenses.push({id:Date.now(),time:now(),category:cat.value,amount:a,mode:mode.value,person:person.value,description:desc.value,status:'Submitted'});save();close();toast('Expense recorded');more()}
function testing(){if(!S.machine)return toast('Choose a machine first');open('Nozzle Testing — '+S.machine,`<div class="ok">Fuel is derived from the selected nozzle. Meter reading is not reduced. Tank return is assumed and managed by Manager controls.</div><label>Nozzle</label><select id="noz" class="select"><option>P1 Petrol</option><option>P2 Petrol</option><option>P3 Petrol</option><option>D1 Diesel</option><option>D2 Diesel</option><option>D3 Diesel</option></select><label>Testing Quantity (L)</label><input id="tq" class="input" type="number" step="0.01"><label>Note</label><input id="tn" class="input"><button class="btn primary full" style="margin-top:15px" onclick="saveTest()">Save Testing</button>`)}function saveTest(){let q=+tq.value;if(q<=0)return toast('Enter valid quantity');S.tests.push({id:Date.now(),time:now(),machine:S.machine,nozzle:noz.value,qty:q,note:tn.value,status:'Recorded'});save();close();toast('Testing recorded');more()}
function closing(){let {c,total}=sums();open('Shift Closing',`<div class="warn">Financial closing only. Meter Handover is already separate. This submission goes to Manager approval.</div><div class="card" style="margin-top:10px"><div class="row between"><span>System Collection</span><b>${money(total)}</b></div><div class="row between"><span>Expenses</span><b>${money(S.expenses.reduce((a,x)=>a+ +x.amount,0))}</b></div></div>${['Cash','UPI','Card','Bank Transfer','Credit'].map(m=>`<label>${m} — Actual Amount</label><input id="cl_${m.replace(/ /g,'_')}" class="input" type="number" value="${c[m].toFixed(2)}">`).join('')}<button class="btn primary full" style="margin-top:15px" onclick="submitClose()">Submit for Manager Approval</button>`)}function submitClose(){let {total}=sums(),actual=['Cash','UPI','Card','Bank Transfer','Credit'].reduce((a,m)=>a+(+document.getElementById('cl_'+m.replace(/ /g,'_')).value||0),0);S.closing={time:now(),expected:total,actual,diff:actual-total,status:'Pending Manager Approval'};save();close();toast('Shift Closing submitted');home()}
function profile(){document.getElementById('screen').innerHTML=`<div class="card hero"><h2>${S.staff.name}</h2><div class="muted">${S.staff.role} • ${S.staff.id}</div></div><div class="card"><div class="section">MY WORK PROFILE</div><div class="list"><div class="row between"><span class="muted">Machine</span><b>${S.machine||'Not selected'}</b></div><div class="row between"><span class="muted">Shift</span><b>${S.shift.type}</b></div><div class="row between"><span class="muted">Timing</span><b>${S.shift.start} – ${S.shift.end}</b></div></div></div><div class="list"><button class="item" onclick="toast('Change password demo')">🔐 <b>Change Password</b></button><button class="item" onclick="toast('Language: English / Hindi-ready')">🌐 <b>Language</b></button><button class="item" onclick="notify()">🔔 <b>Notification Settings</b></button><button class="item" onclick="toast('Help centre demo')">❓ <b>Help</b></button></div>`}function notify(){open('Notifications','<div class="ok">No critical alerts in demo.</div><div class="item" style="margin-top:8px">Meter Handover: no Manager approval gate.</div><div class="item" style="margin-top:8px">Shift Closing: Manager approval required.</div>')}function resetDemo(){localStorage.removeItem(K);location.reload()}home();
</script></body></html>
